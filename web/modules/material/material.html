<div class="mat">
  <div class="mat-kopf">
    <h1 class="large">Material anfordern</h1>
    <button type="button" class="btn" data-senden>Senden</button>
  </div>
  <div class="mat-spalten">
    <div>
      <div class="sect">Artikel</div>
      <div class="list" data-zeilen></div>
      <div class="ffehler" role="alert" data-fehler-zeilen></div>
      <div class="foot">Artikel aus der Checkliste wählen oder frei eintippen.</div>
    </div>
    <div>
      <label class="sect" for="mat_name">Angefordert von</label>
      <div class="list"><div class="row"><input class="field" id="mat_name" maxlength="100" autocomplete="name" placeholder="Vor- und Nachname"></div></div>
      <div class="ffehler" role="alert" data-fehler-name></div>
      <div class="foot">KTW, Datum und Uhrzeit trägt die App ein.</div>
    </div>
  </div>
  <datalist id="mat_artikel"></datalist>
</div>
