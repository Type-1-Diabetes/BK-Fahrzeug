<div class="mat">
  <div class="mat-kopf">
    <h1 class="large">Materialanforderung</h1>
    <button type="button" class="btn" data-senden>Senden</button>
  </div>
  <div class="mat-spalten">
    <div>
      <div class="sect">Artikel</div>
      <div class="segc mat-weg" role="tablist" aria-label="Artikel eingeben" data-weg>
        <button type="button" role="tab" data-v="suchen">Suchen</button>
        <button type="button" role="tab" data-v="liste">Liste durchgehen</button>
      </div>
      <div class="list" data-zeilen></div>
      <input class="field mat-katalog-suche" type="search" placeholder="Artikel suchen" autocomplete="off" aria-label="Liste durchsuchen" data-katalog-suche hidden>
      <div class="mat-katalog" data-katalog hidden></div>
      <div class="ffehler" role="alert" data-fehler-zeilen></div>
    </div>
    <div>
      <label class="sect" for="mat_name">Angefordert durch</label>
      <div class="list"><div class="row"><input class="field" id="mat_name" maxlength="100" autocomplete="name" placeholder="Vor- und Nachname"></div></div>
      <div class="ffehler" role="alert" data-fehler-name></div>
    </div>
  </div>
</div>
