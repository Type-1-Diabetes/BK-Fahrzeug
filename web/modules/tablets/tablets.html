<div class="tool">
  <div><h1>Tablets</h1><div class="sub">Gekoppelte Geräte</div></div>
  <span class="sp"></span>
  <button type="button" class="pbtn" data-pin>PIN festlegen</button>
  <button type="button" class="pbtn def" data-neu>Neues Tablet</button>
</div>
<div class="tablets-inhalt">
  <table class="tab">
    <thead><tr><th>Gerät</th><th>KTW</th><th>Status</th><th>Zuletzt online</th><th></th></tr></thead>
    <tbody data-liste></tbody>
  </table>
</div>
<div class="code-overlay" data-neu-blatt hidden>
  <div class="code-box neu-box" role="dialog" aria-modal="true" aria-labelledby="neuTitel">
    <h2 id="neuTitel" data-neu-titel>Neues Tablet</h2>
    <p data-neu-text>Jedes Tablet gehört fest zu einem KTW.</p>
    <label class="neu-label" for="neuWache">Wache</label>
    <select class="tf neu-name" id="neuWache" data-neu-wache></select>
    <label class="neu-label" for="neuKtw">KTW</label>
    <input class="tf neu-name" id="neuKtw" maxlength="40" autocomplete="off" placeholder="z. B. KTW 4/1" data-neu-ktw>
    <label class="neu-label" for="neuKz">Kennzeichen</label>
    <input class="tf neu-name" id="neuKz" maxlength="20" autocomplete="off" placeholder="z. B. HH-BK 123" data-neu-kz>
    <label class="neu-label" for="neuName">Name des Tablets</label>
    <input class="tf neu-name" id="neuName" maxlength="60" autocomplete="off" data-neu-name>
    <div class="code-acts">
      <button type="button" class="pbtn" data-neu-abbrechen>Abbrechen</button>
      <button type="button" class="pbtn def" data-neu-weiter disabled>Code erzeugen</button>
    </div>
  </div>
</div>
<div class="code-overlay" data-code hidden>
  <div class="code-box" role="dialog" aria-modal="true" aria-labelledby="codeTitel">
    <h2 id="codeTitel" data-titel></h2>
    <p>Öffne am Tablet diesen Link und gib dort den Code ein. Der Code gilt 24 Stunden und nur einmal.</p>
    <div class="code-link waehlbar" data-link></div>
    <div class="bigcode waehlbar" data-wert></div>
    <p class="code-stand" data-stand role="status"></p>
    <div class="code-acts">
      <button type="button" class="pbtn" data-link-kopieren>Link kopieren</button>
      <button type="button" class="pbtn" data-kopieren>Code kopieren</button>
      <button type="button" class="pbtn def" data-fertig>Fertig</button>
    </div>
  </div>
</div>
