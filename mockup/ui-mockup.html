<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BK Fahrzeug – UI-Mockup</title>
<style>
/* Marke Blauer Kreis + Systemfarben, hell ist Standard */
:root{
  --navy:#12135a; --navy2:#1c1e73; --red:#e2001a; --brand:#0a6db5;
  --bg:#f2f2f7; --bg2:#fff; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --label:#0b0b1e; --label2:rgba(40,40,67,.64); --label3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.22);
  --tint:var(--navy2); --ok:#2fa84f; --ok-ink:#1d7a37; --bad:#e2001a; --bad-ink:#c00016; --warn:#f08a00; --warn-ink:#b25f00;
  --bar:rgba(250,250,252,.94); --stage:#d6d7e0; --mac-side:#ececf1;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#000; --bg2:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#8f9bff; --ok:#30d158; --ok-ink:#30d158; --bad:#ff453a; --bad-ink:#ff6961; --warn:#ff9f0a; --warn-ink:#ffb340;
  --bar:rgba(22,22,24,.94); --stage:#0e0e14; --mac-side:#232327; --navy2:#2a2d8f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--label);font-family:var(--sys);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:1px;border-radius:6px}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input,textarea{user-select:text;-webkit-user-select:text}

/* Steuerleiste (nur Mockup) */
.ctl{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #ddd;color:#111}
.seg{display:inline-flex;background:#eee;border-radius:9px;padding:2px}
.seg button{font-size:13px;padding:5px 11px;border-radius:7px;color:#111}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.ctl select{font:inherit;font-size:13px;padding:5px 8px;border-radius:7px;border:1px solid #ccc;background:#fff;color:#111}
.vinfo{width:100%;font-size:13px;color:#444;line-height:1.4}
.stage{padding:20px 16px 40px;display:flex;justify-content:center}

/* ===== iPad quer ===== */
.ipad{background:#0d0d0d;border-radius:40px;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.screen{position:relative;width:1180px;height:820px;border-radius:24px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{height:24px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600}
.content{flex:1;overflow:auto;padding:0 28px 24px}
.large{font-size:32px;font-weight:700;margin:0;padding:6px 28px 12px}
.topnav{flex:none;display:flex;align-items:center;gap:16px;padding:6px 20px 10px}
.brandmini{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--label2);min-width:230px}
.brandmini img{width:30px;height:30px}
.ftabs{margin:0 auto;display:flex;gap:2px;background:var(--bg2);border-radius:99px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ftabs button{min-height:40px;padding:0 18px;border-radius:99px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--label2)}
.ftabs button.on{background:var(--navy2);color:#fff}
.veh{min-width:230px;text-align:right;font-size:14px;color:var(--label2)}
.veh b{color:var(--label);font-size:15px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.25);display:grid;place-items:center}
.sheet{width:760px;height:92%;background:var(--bg);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.snav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.snav h1{font-size:17px;margin:0}
.lnk{color:var(--tint);font-size:17px;min-height:44px}
.lnk.b{font-weight:600}
.status{display:flex;align-items:center;gap:16px;border-radius:16px;padding:16px 20px;background:var(--bg2)}
.status .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;flex:none}
.status.ok .dot{background:var(--ok)} .status.no .dot{background:var(--bad)}
.status h2{margin:0;font-size:22px}
.status.ok h2{color:var(--ok-ink)} .status.no h2{color:var(--bad-ink)}
.status p{margin:2px 0 0;color:var(--label2);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:150px;padding:20px;border-radius:16px;background:var(--bg2);text-align:left}
.tile:active{background:var(--fill2)}
.tile .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:26px}
.tile h3{margin:auto 0 0;font-size:20px}
.tile p{margin:0;font-size:15px;color:var(--label2)}
.due{color:var(--warn-ink)!important;font-weight:600}
.sect{margin:24px 0 8px;padding:0 16px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.03em}
.list{background:var(--bg2);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:400;font-size:17px}
.row .t span{display:block;font-size:14px;color:var(--label2);margin-top:2px}
.row .v{color:var(--label2);font-size:17px}
.row .chev{color:var(--label3)}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.offen{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad-ink)}
.pill.bearb{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn-ink)}
.pill.erl{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok-ink)}
.pill.queue{background:var(--fill);color:var(--label2)}
.foot{padding:8px 16px 0;font-size:13px;color:var(--label2)}
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.segc button{flex:1;min-height:40px;border-radius:7px;font-size:15px}
.segc button.on{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.field{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);padding:0;outline:none}
.field::placeholder{color:var(--label3)}
textarea.field{min-height:100px;resize:none;line-height:1.4}
.switch{width:51px;height:31px;border-radius:99px;background:var(--fill2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--bad)} .switch.on::after{left:22px}
.photo{display:flex;gap:12px;padding:12px 16px}
.ph{width:96px;height:96px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--tint);font-size:28px}
.ph.img{background:linear-gradient(135deg,#9a9aa2,#55555c);color:#fff;font-size:12px;align-content:end;padding:6px}
.stepper{display:inline-flex;background:var(--fill);border-radius:9px;overflow:hidden}
.stepper button{width:48px;height:38px;display:grid;place-items:center;font-size:18px}
.stepper .q{min-width:40px;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;font-size:17px;font-weight:600;background:var(--navy2);color:#fff}
.btn:active{filter:brightness(.85)}
.btn.sec{background:var(--fill);color:var(--tint)}
.split{flex:1;display:flex;min-height:0}
.split .side{width:310px;flex:none;border-right:.5px solid var(--sep);overflow:auto;padding:0 14px 14px}
.split .main{flex:1;display:flex;flex-direction:column;min-width:0}
.area{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px 8px 20px;border-radius:10px;font-size:16px;width:100%;text-align:left}
.area::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--c)}
.area.on{background:var(--navy2);color:#fff}
.area span{margin-left:auto;font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums}
.area.on span{color:rgba(255,255,255,.8)}
.progress{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--navy2)}
.ck{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;position:relative}
.ck+.ck::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--sep)}
.ck .box{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:17px;color:#fff;background:var(--ok)}
.ck .box.warn{background:var(--warn)}
.ck .t{flex:1}
.ck .t b{display:block;font-weight:400;font-size:17px}
.ck .t span{display:block;font-size:14px;color:var(--label2);margin-top:2px}
.ck .soll{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;text-align:right}
.ck .soll strong{color:var(--warn-ink)}
.ck.dev{background:color-mix(in srgb,var(--warn) 8%,var(--bg2))}
.bottombar{flex:none;display:flex;gap:12px;align-items:center;padding:12px 28px 20px;border-top:.5px solid var(--sep);background:var(--bar)}
.pair{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.pair h1{margin:4px 0 0;font-size:32px}
.pair p{margin:0;color:var(--label2);font-size:17px;max-width:44ch;line-height:1.4}
.code{display:flex;gap:10px;margin:10px 0}
.code span{width:62px;height:76px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:34px;font-weight:600;border:2px solid transparent}
.code span.cur{border-color:var(--navy2)}
.code i{width:14px;align-self:center;height:2px;background:var(--label3)}
.badge{width:96px;height:96px;object-fit:contain}

/* ===== Mac ===== */
.mac{width:1280px;height:800px;border-radius:12px;overflow:hidden;display:flex;background:var(--bg2);box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.3);font-size:13px;position:relative}
.mside{width:220px;flex:none;background:var(--mac-side);display:flex;flex-direction:column;padding:0 10px 10px;border-right:.5px solid var(--sep)}
.lights{display:flex;gap:8px;padding:16px 10px 12px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e} .lights i:nth-child(3){background:#28c840}
.mlogo{display:flex;align-items:center;gap:8px;padding:0 8px 6px;font-weight:700;font-size:14px}
.mlogo img{width:26px;height:26px}
.mside h6{margin:12px 10px 4px;font-size:11px;font-weight:600;color:var(--label2)}
.si{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:6px}
.si svg{color:var(--brand);font-size:16px}
.si.on{background:var(--fill2)}
.si .n{margin-left:auto;color:var(--label2);font-variant-numeric:tabular-nums}
.si .n.r{color:var(--bad-ink);font-weight:600}
.who{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:var(--label2)}
.av{width:26px;height:26px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--label)}
.mmain{flex:1;display:flex;flex-direction:column;min-width:0}
.tool{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:.5px solid var(--sep)}
.tool h1{font-size:15px;margin:0}
.tool .sub{color:var(--label2);font-size:12px}
.tool .sp{flex:1}
.tb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;color:var(--label2)}
.tb svg{font-size:15px}
.search{display:flex;align-items:center;gap:6px;width:200px;height:28px;padding:0 8px;border-radius:7px;background:var(--fill);color:var(--label2)}
.mseg{display:inline-flex;background:var(--fill);border-radius:7px;padding:2px}
.mseg button{height:22px;padding:0 10px;border-radius:5px;font-size:12px}
.mseg button.on{background:var(--bg2);box-shadow:0 .5px 2px rgba(0,0,0,.2)}
.pbtn{height:24px;padding:0 12px;border-radius:6px;background:var(--bg2);box-shadow:0 0 0 .5px var(--sep),0 .5px 1px rgba(0,0,0,.12);white-space:nowrap}
.pbtn:active{filter:brightness(.9)}
.pbtn.def{background:var(--navy2);color:#fff;box-shadow:none}
.mbody{flex:1;display:flex;min-height:0}
.tablewrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:500;color:var(--label2);height:28px;padding:0 10px;border-bottom:.5px solid var(--sep);white-space:nowrap}
td{height:30px;padding:0 10px;white-space:nowrap}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--fill) 45%,transparent)}
tbody tr.sel td{background:var(--navy2);color:#fff}
tbody tr.sel .pill{background:rgba(255,255,255,.22);color:#fff}
td.num{text-align:right}
.mp{font-size:11px;padding:1px 7px}
.insp{width:350px;flex:none;border-left:.5px solid var(--sep);overflow:auto;padding:16px}
.insp h2{margin:0;font-size:17px}
.insp .m{color:var(--label2);margin-top:3px}
.note{background:var(--fill);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.45}
.ih{margin:16px 0 6px;font-size:11px;font-weight:600;color:var(--label2)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.kv label{color:var(--label2);text-align:right}
.tf{height:22px;border-radius:5px;background:var(--bg2);box-shadow:0 0 0 .5px var(--sep);padding:0 7px;display:flex;align-items:center}
.tf.mute{color:var(--label3)}
.tf.sm{width:60px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.pop{height:22px;border-radius:5px;background:var(--bg2);box-shadow:0 0 0 .5px var(--sep),0 .5px 1px rgba(0,0,0,.1);padding:0 6px 0 8px;display:inline-flex;align-items:center;gap:6px}
.pop svg{font-size:11px;color:var(--label2)}
.cb{display:flex;align-items:center;gap:6px}
.cb i{width:14px;height:14px;border-radius:4px;box-shadow:0 0 0 .5px var(--sep);background:var(--bg2);display:grid;place-items:center;font-size:10px;color:#fff;font-style:normal}
.cb i.on{background:var(--navy2);box-shadow:none}
.tl{border-left:2px solid var(--fill2);margin-left:5px;padding-left:12px}
.tl div{position:relative;padding:4px 0;color:var(--label2)}
.tl div::before{content:"";position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--label3)}
.tl b{color:var(--label);font-weight:500}
.acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.vlist{width:250px;flex:none;border-right:.5px solid var(--sep);overflow:auto}
.vgrp{padding:10px 14px 4px;font-size:11px;font-weight:600;color:var(--label2)}
.vr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--sep)}
.vr i{width:10px;height:10px;border-radius:50%;flex:none}
.vr b{display:block}
.vr span{display:block;color:var(--label2);font-size:12px}
.vr.on{background:color-mix(in srgb,var(--navy2) 12%,transparent)}
.vfile{flex:1;overflow:auto;padding:18px 22px}
.hd{display:flex;align-items:center;gap:12px}
.hd h2{margin:0;font-size:22px}
.amp{padding:4px 10px;border-radius:7px;color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:.5px solid var(--sep)}
.tabs button{padding:8px 12px;color:var(--label2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--label);border-color:var(--navy2);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--fill);border-radius:10px;padding:10px 12px}
.kpi span{color:var(--label2)} .kpi b{display:block;font-size:15px;margin-top:3px}
.grp{background:var(--fill);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.grp h3{margin:0 0 10px;font-size:13px}
.radio{display:flex;align-items:center;gap:6px}
.radio i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 .5px var(--sep);background:var(--bg2)}
.radio i.on{background:var(--navy2);box-shadow:inset 0 0 0 4px var(--navy2),inset 0 0 0 7px #fff}
.msheet{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:430px;background:var(--bg2);border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 20px 50px rgba(0,0,0,.3);padding:20px}
.msheet h2{margin:0 0 4px;font-size:15px}
.msheet p{margin:0 0 14px;color:var(--label2);line-height:1.4}
.bigcode{font-size:40px;font-weight:600;letter-spacing:.14em;text-align:center;padding:16px;background:var(--fill);border-radius:10px;font-variant-numeric:tabular-nums}
.red{color:var(--bad-ink)} .warnt{color:var(--warn-ink)}
.stripe{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:6px}
.sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.sig div{background:var(--fill);border-radius:8px;padding:10px}
.sig span{color:var(--label2);display:block}
.sig b{display:block;margin-top:3px}
</style>
</head>
<body>
<div class="ctl" role="toolbar" aria-label="Mockup-Steuerung">
  <div class="seg" id="dev"><button data-v="ipad" aria-pressed="true">iPad (quer)</button><button data-v="mac" aria-pressed="false">Mac</button></div>
  <select id="scr" aria-label="Ansicht"></select>
  <div class="seg" id="thm"><button data-v="light" aria-pressed="true">Hell</button><button data-v="dark" aria-pressed="false">Dunkel</button></div>
  <div class="vinfo" id="vinfo"></div>
</div>
<div class="stage"><div id="scaler"></div></div>

<script>
const P={
 wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L4 16.7 7.3 20l5.3-5.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
 box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
 car:'<path d="M3 15V9l2-4h9l3 4h2a2 2 0 0 1 2 2v4h-2"/><circle cx="7" cy="16" r="2"/><circle cx="17" cy="16" r="2"/><path d="M9 16h6"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', chevR:'<path d="m9 5 7 7-7 7"/>', chevL:'<path d="m15 5-7 7 7 7"/>', chevD:'<path d="m6 9 6 6 6-6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', check:'<path d="m5 12.5 4.5 4.5L19 7"/>',

}
function fit(){const sc=document.getElementById('scaler');sc.style.zoom=1;const el=sc.firstElementChild;if(!el)return;
 const top=document.querySelector('.ctl').offsetHeight;
 sc.style.zoom=Math.min(1,(innerWidth-32)/el.offsetWidth,(innerHeight-top-40)/el.offsetHeight);}
function bindSeg(id,key){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 S[key]=b.dataset.v;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});}

document.getElementById('scr').addEventListener('change',e=>{S.scr=e.target.value;render();});
addEventListener('resize',fit);
render();
