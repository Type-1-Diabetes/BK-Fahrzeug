(function () {
  window.timeAgo = function (ts) {
    const t = typeof ts === 'number' ? ts : new Date(ts).getTime();
    if (!t || isNaN(t)) return '–';
    const diff = Date.now() - t;
    if (diff < 0) return 'gleich';
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'gerade eben';
    if (m < 60) return `vor ${m} Min.`;
    const h = Math.floor(m / 60);
    if (h < 24) return `vor ${h} Std.`;
    const d = Math.floor(h / 24);
    if (d < 7) return d === 1 ? 'gestern' : `vor ${d} Tagen`;
    return new Date(t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
  };

  window.copyText = async function (text) {
    try { await navigator.clipboard.writeText(String(text)); return true; } catch { return false; }
  };

  const HAKEN = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
  const UHR = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  let toastBox = null;
  window.showToast = function (text, art) {
    if (!toastBox) {
      toastBox = document.createElement('div');
      toastBox.className = 'toasts';
      toastBox.setAttribute('role', 'status');
      toastBox.setAttribute('aria-live', 'polite');
      document.body.append(toastBox);
    }
    const t = document.createElement('div');
    t.className = 'toast' + (art === 'fehler' ? ' fehler' : '');
    if (art !== 'fehler') t.innerHTML = HAKEN;  // festes Symbol, kein Benutzertext
    t.append(document.createTextNode(String(text)));
    toastBox.append(t);
    setTimeout(() => { t.classList.add('weg'); setTimeout(() => t.remove(), 250); }, 2600);
  };

  // fn läuft einmal, Doppelklicks zählen nicht. Gibt das Ergebnis von fn zurück.
  window.mitStatus = async function (knopf, fn) {
    if (knopf.classList.contains('laedt')) return;
    knopf.classList.add('laedt'); knopf.disabled = true;
    try {
      const r = await fn();
      if (r !== false && knopf.isConnected) { knopf.classList.add('fertig'); setTimeout(() => knopf.classList.remove('fertig'), 900); }
      return r;
    } finally { knopf.classList.remove('laedt'); knopf.disabled = false; }
  };

  // art 'wartet': orange Uhr statt grünem Haken (auf dem Gerät gespeichert, noch nicht gesendet)
  window.erfolg = function (titel, text, ms, art) {
    return new Promise(ok => {
      const o = document.createElement('div');
      o.className = 'erfolg' + (art === 'wartet' ? ' wartet' : '');
      o.setAttribute('role', 'status');
      const kreis = document.createElement('div');
      kreis.className = 'erfolg-kreis';
      kreis.innerHTML = art === 'wartet' ? UHR : HAKEN;
      const h = document.createElement('h2'); h.textContent = titel;
      const p = document.createElement('p'); p.textContent = text || '';
      o.append(kreis, h, p);
      const zu = () => { o.classList.add('weg'); setTimeout(() => { o.remove(); ok(); }, 200); };
      o.onclick = zu;
      document.body.append(o);
      setTimeout(zu, ms || 2000);
    });
  };

  window.exportCSV = function (dateiname, zeilen) {
    if (!Array.isArray(zeilen) || !zeilen.length) return false;
    const spalten = Object.keys(zeilen[0]);
    const zelle = v => {
      let s = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
      if (/^[=+\-@]/.test(s)) s = "'" + s;  // keine Formeln in Excel
      if (/[";\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    const csv = '﻿' + [spalten.join(';'), ...zeilen.map(r => spalten.map(c => zelle(r[c])).join(';'))].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = dateiname.endsWith('.csv') ? dateiname : dateiname + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return true;
  };
})();

/* ════════════════════════════════════════════════════════
   SETTINGS-LAYOUT — Unter-Navigation, Suche, Speicherleiste
   Übernommen aus der Website Schrietz (admin/js/settings-layout.js).
   Markup: .sl[data-sl="id"] > .sl-nav (.sl-nav-item[data-sl-page]) + .sl-main (.sl-page[data-sl-page])
   CSS: css/komponenten.css
════════════════════════════════════════════════════════ */
(function () {
    'use strict';

    const _ctls = {};

    function _store(key, val) {
        try {
            if (val === undefined) return localStorage.getItem(key);
            localStorage.setItem(key, val);
        } catch { return null; }
    }

    // Suche: Groß/klein + Umlaute egal
    function _norm(s) {
        return String(s || '').toLowerCase()
            .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
    }

    function _escText(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /**
     * Bindet ein .sl-Layout an.
     * opts.onSave()    → async, true bei Erfolg (zeigt Speicherleiste bei Änderungen)
     * opts.onDiscard() → Werte neu laden
     * opts.onShow(page)→ beim Wechsel der Unterseite
     */
    function mount(root, opts) {
        if (!root) return null;
        if (root._sl) { Object.assign(root._sl.opts, opts || {}); return root._sl; }
        opts = opts || {};

        const id    = root.dataset.sl || 'sl';
        const pages = () => Array.from(root.querySelectorAll('.sl-page[data-sl-page]'));
        const items = () => Array.from(root.querySelectorAll('.sl-nav-item[data-sl-page]'));
        const main  = root.querySelector('.sl-main');
        let current = null;
        let isDirty = false;
        let saving  = false;

        const ctl = { root, opts, id };

        ctl.show = function (page, { scroll = true } = {}) {
            if (!root.querySelector(`.sl-page[data-sl-page="${page}"]`)) page = pages()[0]?.dataset.slPage;
            if (!page) return;
            const changed = current !== page;
            current = page;
            pages().forEach(p => p.classList.toggle('active', p.dataset.slPage === page));
            items().forEach(b => {
                const on = b.dataset.slPage === page;
                b.classList.toggle('active', on);
                b.setAttribute('aria-current', on ? 'page' : 'false');
                if (on && window.matchMedia('(max-width: 860px)').matches) {
                    b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
                }
            });
            _store('sl:' + id, page);
            if (changed && scroll) {
                const top = root.getBoundingClientRect().top;
                if (top < 0) window.scrollBy({ top: top - 70, behavior: 'smooth' });
            }
            if (changed && typeof opts.onShow === 'function') opts.onShow(page);
        };
        ctl.current = () => current;

        ctl.led = function (page, state, title) {
            const led = root.querySelector(`.sl-nav-item[data-sl-page="${page}"] .sl-led`);
            if (!led) return;
            led.className = 'sl-led' + (state ? ' ' + state : '');
            if (title !== undefined) led.title = title;
        };

        // ── Navigation ──
        items().forEach(b => b.addEventListener('click', () => {
            if (search && search.value) { search.value = ''; runSearch(''); }
            ctl.show(b.dataset.slPage);
        }));

        // ── Suche ──
        const search = root.querySelector('.sl-search input');
        let info = root.querySelector('.sl-search-info');
        let empty = null;
        if (search && main && !info) {
            info = document.createElement('div');
            info.className = 'sl-search-info';
            main.prepend(info);
        }
        function runSearch(q) {
            const words = _norm(q).trim().split(/\s+/).filter(Boolean);
            if (!words.length) {
                root.classList.remove('sl--searching');
                root.querySelectorAll('.sl-hit, .sl-miss').forEach(el => el.classList.remove('sl-hit', 'sl-miss'));
                items().forEach(b => b.classList.remove('sl-nomatch'));
                if (empty) { empty.remove(); empty = null; }
                return;
            }
            root.classList.add('sl--searching');
            let hits = 0, pageHits = 0;
            pages().forEach(p => {
                const head = _norm((p.dataset.slKeywords || '') + ' ' + (p.querySelector('.sl-page-head')?.textContent || ''));
                const headHit = words.every(w => head.includes(w));
                let pHits = 0;
                p.querySelectorAll('.sl-block').forEach(bl => {
                    const txt = headHit ? '' : _norm((bl.dataset.slKeywords || '') + ' ' + bl.textContent);
                    const hit = headHit || words.every(w => txt.includes(w));
                    bl.classList.toggle('sl-miss', !hit);
                    if (hit) pHits++;
                });
                p.classList.toggle('sl-hit', pHits > 0);
                items().filter(b => b.dataset.slPage === p.dataset.slPage)
                    .forEach(b => b.classList.toggle('sl-nomatch', pHits === 0));
                hits += pHits;
                if (pHits) pageHits++;

            if (info) info.textContent = hits
                ? `${hits} Treffer in ${pageHits} ${pageHits === 1 ? 'Bereich' : 'Bereichen'}`
                : '';
            if (!hits && main) {
                if (!empty) { empty = document.createElement('div'); empty.className = 'sl-empty'; main.appendChild(empty); }
                empty.textContent = `Keine Einstellung zu „${q.trim()}“ gefunden.`;
            } else if (empty) { empty.remove(); empty = null; }
        }
        if (search) {
            search.addEventListener('input', () => runSearch(search.value));
            search.addEventListener('keydown', e => {
                if (e.key === 'Escape') { search.value = ''; runSearch(''); search.blur(); }
                if (e.key === 'Enter') e.preventDefault(); // nicht das umgebende Formular absenden
            });
        }

        // ── Speicherleiste ──
        let bar = null;
        if (typeof opts.onSave === 'function' && main) {
            bar = document.createElement('div');
            bar.className = 'sl-savebar';
            bar.setAttribute('role', 'status');
            bar.innerHTML = `
                <div class="sl-savebar-text">
                    <span>Ungespeicherte Änderungen <small class="sl-savebar-kbd">Strg + S</small></span></div>
                <button type="button" class="pbtn" data-sl-discard>Verwerfen</button>
                <button type="button" class="pbtn def" data-sl-save>Speichern</button>`;
            main.appendChild(bar);
            bar.querySelector('[data-sl-save]').addEventListener('click', () => ctl.save());
            bar.querySelector('[data-sl-discard]').addEventListener('click', async () => {
                if (typeof opts.onDiscard === 'function') await opts.onDiscard();
                ctl.clean();
            });
            const markDirty = e => {
                if (e.target.closest('.sl-search, [data-sl-nodirty]')) return;
                ctl.dirty();
            };
            root.addEventListener('input', markDirty);
            root.addEventListener('change', markDirty);
        }

        ctl.dirty = function () {
            if (!bar) return;
            isDirty = true;
            bar.classList.add('show');
        };
        ctl.clean = function () {
            isDirty = false;
            if (bar) bar.classList.remove('show');
        };
        ctl.isDirty = () => isDirty;
        ctl.save = async function () {
            if (!bar || saving) return;
            saving = true;
            const btn  = bar.querySelector('[data-sl-save]');
            const orig = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = 'Speichern …';
            try {
                const ok = await opts.onSave();
                if (ok !== false) ctl.clean();
            } finally {
                saving = false;
                btn.disabled = false;
                btn.innerHTML = orig;
            }
        };

        root._sl = ctl;
        _ctls[id] = ctl;
        ctl.show(_store('sl:' + id) || root.dataset.slDefault || pages()[0]?.dataset.slPage, { scroll: false });
        return ctl;
    }

    function _visible(el) { return !!(el && el.offsetParent !== null); }

    // Strg/Cmd + S speichert das sichtbare Layout
    document.addEventListener('keydown', e => {
        if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 's') return;
        const ctl = Object.values(_ctls).find(c => _visible(c.root) && c.isDirty());
        if (!ctl) return;
        e.preventDefault();
        ctl.save();
    });

    window.addEventListener('beforeunload', e => {
        if (Object.values(_ctls).some(c => c.isDirty())) { e.preventDefault(); e.returnValue = ''; }
    });

    window.SettingsLayout = {
        mount,
        get: id => _ctls[id] || null,
        anyDirty: () => Object.values(_ctls).some(c => c.isDirty() && _visible(c.root)),
        open(id, page) { const c = _ctls[id]; if (c) c.show(page); },
    };
})();

/* Offline-Warteschlange: Schreibaktionen werden erst auf dem Gerät gespeichert (IndexedDB)
   und der Reihe nach gesendet, sobald Netz da ist. */
(function () {
  'use strict';
  const DB = 'bk_warteschlange', STORE = 'eintraege';
  const hoerer = new Set();
  let sendetGerade = false;

  function oeffnen() {
    return new Promise((ok, fehler) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'nr', autoIncrement: true });
      r.onsuccess = () => ok(r.result);
      r.onerror = () => fehler(r.error);
    });
  }
  async function tx(modus, fn) {
    const db = await oeffnen();
    return new Promise((ok, fehler) => {
      const t = db.transaction(STORE, modus);
      const res = fn(t.objectStore(STORE));
      t.oncomplete = () => { db.close(); ok(res && res.result); };
      t.onerror = () => { db.close(); fehler(t.error); };
    });
  }

  const alle = () => tx('readonly', s => s.getAll());
  async function melden() {
    const liste = await alle();
    hoerer.forEach(fn => { try { fn(liste); } catch { /* egal */ } });
  }

  // warten: liefert { gesendet } (true = beim Server, false = wartet auf dem Gerät), höchstens 8 s
  async function hinzufuegen(eintrag, { warten } = {}) {
    const nr = await tx('readwrite', s => s.add({ ...eintrag, erstellt: Date.now(), fehler: null }));
    await melden();
    if (!warten) { senden(); return; }
    await Promise.race([senden(), new Promise(ok => setTimeout(ok, 8000))]);
    return { gesendet: !(await tx('readonly', s => s.get(nr))) };
  }

  // Der Reihe nach senden. Ohne Netz: abbrechen und später erneut. Fehler vom Server: Eintrag markieren.
  async function senden() {
    if (sendetGerade || !navigator.onLine) return;
    sendetGerade = true;
    try {
      for (const e of await alle()) {
        if (e.fehler) continue;
        try {
          await BK.api._senden[e.typ](e);
          await tx('readwrite', s => s.delete(e.nr));
        } catch (err) {
          if (err.offline || err.status >= 500 || err.status === 401) break;
          await tx('readwrite', s => s.put({ ...e, fehler: err.message }));
        }
        await melden();
      }
    } finally {
      sendetGerade = false;
      await melden();
    }
  }

  // Fehlerhaften Eintrag erneut versuchen oder verwerfen
  async function erneut(nr) {
    const e = await tx('readonly', s => s.get(nr));
    if (e) await tx('readwrite', s => s.put({ ...e, fehler: null }));
    senden();
  }
  async function verwerfen(nr) { await tx('readwrite', s => s.delete(nr)); await melden(); }

  window.addEventListener('online', senden);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) senden(); });

  window.BK = window.BK || {};
  window.BK.warteschlange = {
    hinzufuegen, senden, alle, erneut, verwerfen,
    beiAenderung(fn) { hoerer.add(fn); alle().then(fn).catch(() => {}); return () => hoerer.delete(fn); },
  };
})();

/* Eigene Auswahlliste statt Browser-Dropdown. Jedes <select> bekommt automatisch einen Knopf und eine Liste.
   Das <select> bleibt (versteckt) die Quelle: Wert, Optionen und „change“ funktionieren wie vorher. */
(function () {
  'use strict';
  const HAKEN = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
  const PFEIL = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>';
  let offen = null;  // { select, knopf, liste }
  let nr = 0;

  function text(select) {
    const o = select.options[select.selectedIndex];
    return o ? o.textContent : '';
  }

  function aufwerten(select) {
    if (select.dataset.auswahl) return;
    select.dataset.auswahl = '1';
    const id = 'auswahl-' + (++nr);
    const knopf = document.createElement('button');
    knopf.type = 'button';
    knopf.className = 'auswahl-knopf ' + select.className;
    knopf.setAttribute('aria-haspopup', 'listbox');
    knopf.setAttribute('aria-expanded', 'false');
    knopf.setAttribute('aria-controls', id);
    if (select.getAttribute('aria-label')) knopf.setAttribute('aria-label', select.getAttribute('aria-label'));
    if (select.id) { knopf.id = select.id; select.removeAttribute('id'); }  // <label for> zeigt auf den Knopf
    const wert = document.createElement('span');
    wert.className = 'auswahl-wert';
    knopf.append(wert);
    knopf.insertAdjacentHTML('beforeend', PFEIL);  // festes Symbol
    select.classList.add('auswahl-nativ');
    select.tabIndex = -1;
    select.setAttribute('aria-hidden', 'true');
    select.after(knopf);

    const zeigen = () => {
      const t = text(select);
      wert.textContent = t;
      knopf.classList.toggle('ohne-wert', !select.value && select.classList.contains('field'));  // nur Formular-Platzhalter grau
      knopf.disabled = select.disabled;
    };
    zeigen();
    select.addEventListener('change', zeigen);
    new MutationObserver(zeigen).observe(select, { childList: true, subtree: true, attributes: true });
    knopf.addEventListener('click', () => (offen && offen.select === select ? schliessen() : oeffnen(select, knopf, id)));
    knopf.addEventListener('keydown', e => {
      if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key) && !offen) { e.preventDefault(); oeffnen(select, knopf, id); }
    });
  }

  function oeffnen(select, knopf, id) {
    schliessen();
    const liste = document.createElement('div');
    liste.className = 'auswahl-liste' + (knopf.closest('.huelle-mac') && !knopf.closest('.blatt') ? ' klein' : '');
    liste.id = id;
    liste.setAttribute('role', 'listbox');
    liste.tabIndex = -1;
    [...select.options].forEach((o, i) => {
      const z = document.createElement('div');
      z.className = 'auswahl-option' + (o.value === '' ? ' platzhalter' : '');
      z.setAttribute('role', 'option');
      z.setAttribute('aria-selected', String(i === select.selectedIndex));
      z.dataset.i = i;
      z.insertAdjacentHTML('beforeend', HAKEN);
      const s = document.createElement('span');
      s.textContent = o.textContent;
      z.append(s);
      if (o.disabled) z.setAttribute('aria-disabled', 'true');
      z.addEventListener('click', () => waehlen(i));
      z.addEventListener('mousemove', () => markieren(i));
      liste.append(z);
    });
    document.body.append(liste);
    offen = { select, knopf, liste, aktiv: Math.max(0, select.selectedIndex) };
    knopf.setAttribute('aria-expanded', 'true');
    knopf.classList.add('offen');
    platzieren();
    markieren(offen.aktiv);
    liste.focus({ preventScroll: true });
    liste.addEventListener('keydown', taste);
  }

  // Unter dem Knopf, oben wenn unten kein Platz. Mindestens so breit wie der Knopf.
  function platzieren() {
    if (!offen) return;
    const r = offen.knopf.getBoundingClientRect();
    const l = offen.liste;
    l.style.minWidth = Math.max(r.width, 160) + 'px';
    const hoehe = Math.min(l.scrollHeight, 320);
    const unten = innerHeight - r.bottom - 12, oben = r.top - 12;
    const nachOben = unten < hoehe && oben > unten;
    l.style.maxHeight = Math.max(120, Math.min(320, nachOben ? oben : unten)) + 'px';
    l.style.left = Math.min(r.left, innerWidth - l.offsetWidth - 8) + 'px';
    l.style.top = (nachOben ? r.top - Math.min(hoehe, oben) - 4 : r.bottom + 4) + 'px';
    l.classList.toggle('nach-oben', nachOben);
  }

  function markieren(i) {
    if (!offen) return;
    offen.aktiv = i;
    offen.liste.querySelectorAll('.auswahl-option').forEach(z => z.classList.toggle('aktiv', Number(z.dataset.i) === i));
    const z = offen.liste.querySelector(`[data-i="${i}"]`);
    if (z) z.scrollIntoView({ block: 'nearest' });
  }

  function waehlen(i) {
    if (!offen) return;
    const { select, knopf } = offen;
    if (select.options[i] && !select.options[i].disabled && select.selectedIndex !== i) {
      select.selectedIndex = i;
      select.dispatchEvent(new Event('change', { bubbles: true }));
      select.dispatchEvent(new Event('input', { bubbles: true }));
    }
    schliessen();
    knopf.focus({ preventScroll: true });
  }

  let suche = '', sucheTimer = null;
  function taste(e) {
    const n = offen.select.options.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); markieren(Math.min(n - 1, offen.aktiv + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); markieren(Math.max(0, offen.aktiv - 1)); }
    else if (e.key === 'Home') { e.preventDefault(); markieren(0); }
    else if (e.key === 'End') { e.preventDefault(); markieren(n - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); waehlen(offen.aktiv); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); const k = offen.knopf; schliessen(); k.focus(); }
    else if (e.key.length === 1) {
      // Tippen springt zum passenden Eintrag

      clearTimeout(sucheTimer); sucheTimer = setTimeout(() => { suche = ''; }, 700);
      const i = [...offen.select.options].findIndex(o => o.textContent.toLowerCase().startsWith(suche));
      if (i >= 0) markieren(i);
    }
  }

  function schliessen() {
    if (!offen) return;
    offen.knopf.setAttribute('aria-expanded', 'false');
    offen.knopf.classList.remove('offen');
    offen.liste.remove();
    offen = null;
  }

  document.addEventListener('pointerdown', e => { if (offen && !offen.liste.contains(e.target) && !offen.knopf.contains(e.target)) schliessen(); }, true);
  addEventListener('resize', schliessen);
  document.addEventListener('scroll', e => { if (offen && !offen.liste.contains(e.target)) schliessen(); }, true);

  // Alle vorhandenen und künftigen <select> aufwerten
  const alle = wurzel => (wurzel.matches && wurzel.matches('select') ? [wurzel] : [...(wurzel.querySelectorAll ? wurzel.querySelectorAll('select') : [])]).forEach(aufwerten);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(k => k.nodeType === 1 && alle(k)))).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', () => alle(document));
})();

/* Fristen für Checklisten: welcher Zeitraum gerade läuft und bis wann die Checkliste fällig ist.
   Schlüssel (checklisten.zeitraum): monatlich 2026-10, quartal 2026-Q4, halbjahr 2026-H2, jahr 2026 */
(function () {
  'use strict';
  const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const INTERVALLE = { monatlich: 'Monatlich', quartal: 'Jedes Quartal', halbjahr: 'Jedes Halbjahr', jahr: 'Jedes Jahr' };

  // Zeitraum, in den das Datum fällt
  function zeitraum(intervall, d = new Date()) {
    const j = d.getFullYear(), m = d.getMonth();
    if (intervall === 'monatlich') return { key: `${j}-${String(m + 1).padStart(2, '0')}`, ende: new Date(j, m + 1, 0) };
    if (intervall === 'halbjahr') { const h = m < 6 ? 1 : 2; return { key: `${j}-H${h}`, ende: new Date(j, h * 6, 0) }; }
    if (intervall === 'jahr') return { key: String(j), ende: new Date(j, 12, 0) };
    const q = Math.floor(m / 3) + 1;
    return { key: `${j}-Q${q}`, ende: new Date(j, q * 3, 0) };
  }

  // Lesbarer Text zum Schlüssel
  function zeitraumText(key) {
    let t;
    if ((t = /^(\d{4})-Q([1-4])$/.exec(key))) return `${t[2]}. Quartal ${t[1]}`;
    if ((t = /^(\d{4})-H([12])$/.exec(key))) return `${t[2]}. Halbjahr ${t[1]}`;
    if ((t = /^(\d{4})-(\d{2})$/.exec(key))) return `${MONATE[Number(t[2]) - 1]} ${t[1]}`;
    if (/^\d{4}$/.test(key)) return `Jahr ${key}`;
    return key;
  }

  // Frist für ein Fahrzeug: eigene des KTW, sonst der Wache, sonst Standard, sonst Quartal/14 Tage
  function fuer(fristen, fahrzeug) {
    const wache = fahrzeug && (fahrzeug.wache_id || (fahrzeug.wache && fahrzeug.wache.id));
    const f = (fristen || []).find(x => fahrzeug && x.fahrzeug_id === fahrzeug.id)
      || (fristen || []).find(x => wache && x.wache_id === wache && !x.fahrzeug_id)
      || (fristen || []).find(x => !x.wache_id && !x.fahrzeug_id)
      || { intervall: 'quartal', vorlauf_tage: 14 };
    const z = zeitraum(f.intervall);
    const tage = Math.ceil((z.ende - new Date()) / 864e5);
    return {
      intervall: f.intervall, vorlauf: f.vorlauf_tage, key: z.key, ende: z.ende, text: zeitraumText(z.key), tage,
      bis: z.ende.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }),
      bald: tage <= f.vorlauf_tage,  // Erinnerungszeit läuft

/* Formulare aus einer Beschreibung bauen. Ein neues Feld braucht keinen neuen Code.
   Feld: { name, typ, label, pflicht, platzhalter, optionen: [[wert, text]], standard, hinweis, wenn: werte => bool, max }
   Typen: text, textarea, segment, auswahl, zahl, fotos */
(function () {
  'use strict';
  const { el } = BK;

  function bauen(root, felder, start = {}) {
    const werte = { ...start };
    felder.forEach(f => { if (werte[f.name] === undefined && f.standard !== undefined) werte[f.name] = f.standard; });
    const bloecke = new Map();

    function feld(f) {
      const id = 'f_' + f.name;
      let eingabe;
      switch (f.typ) {
        case 'textarea':
          eingabe = el('textarea.field', { id, placeholder: f.platzhalter, maxlength: f.max || 2000, oninput: e => { werte[f.name] = e.target.value; } });
          eingabe.value = werte[f.name] || '';
          break;
        case 'segment': {
          eingabe = el('div.segc', { role: 'radiogroup', 'aria-label': f.label });
          for (const [wert, text] of f.optionen) {
            const b = el('button', { type: 'button', role: 'radio', 'aria-checked': String(werte[f.name] === wert), class: werte[f.name] === wert ? 'on' : null,
              onclick: () => { werte[f.name] = wert; aktualisieren(); } }, text);
            eingabe.append(b);
          }
          break;
        }
        case 'auswahl':
          eingabe = el('select.field', { id, onchange: e => { werte[f.name] = e.target.value || null; aktualisieren(); } },
            el('option', { value: '' }, f.platzhalter || 'Bitte wählen'),
            ...f.optionen.map(([w, t]) => el('option', { value: w, selected: werte[f.name] === w }, t)));
          break;
        case 'zahl':
          eingabe = el('input.field', { id, type: 'number', inputmode: 'numeric', min: f.min ?? 0, max: f.max ?? 999, value: werte[f.name] ?? '',
            oninput: e => { werte[f.name] = e.target.value === '' ? null : Number(e.target.value); } });
          break;
        case 'fotos':
          eingabe = fotoFeld(f, werte);
          break;
        default:
          eingabe = el('input.field', { id, type: 'text', placeholder: f.platzhalter, maxlength: f.max || 200, autocomplete: f.autocomplete || 'off',
            value: werte[f.name] || '', oninput: e => { werte[f.name] = e.target.value; } });
      }
      const listeTyp = ['text', 'textarea', 'zahl', 'auswahl', undefined].includes(f.typ);
      return el('div.fblock', { dataset: { feld: f.name } },
        f.label ? el('label.sect', { for: listeTyp ? id : null }, f.label + (f.pflicht ? '' : ' (optional)')) : null,
        listeTyp ? el('div.list', el('div.row', eingabe)) : eingabe,
        f.hinweis ? el('div.foot', f.hinweis) : null,
        el('div.ffehler', { role: 'alert' }));
    }

    // Sichtbarkeit (wenn) neu prüfen und Segmente neu zeichnen
    function aktualisieren() {
      for (const f of felder) {
        const alt = bloecke.get(f.name);
        const sichtbar = !f.wenn || f.wenn(werte);
        if (f.typ === 'segment' || f.typ === 'auswahl') {
          const neu = feld(f);
          alt.replaceWith(neu);
          bloecke.set(f.name, neu);
        }
        bloecke.get(f.name).hidden = !sichtbar;
      }
    }

    BK.leeren(root);
    for (const f of felder) { const b = feld(f); bloecke.set(f.name, b); root.append(b); }
    aktualisieren();

    return {
      werte: () => {
        const aus = {};
        for (const f of felder) if (!f.wenn || f.wenn(werte)) aus[f.name] = typeof werte[f.name] === 'string' ? werte[f.name].trim() : werte[f.name];
        return aus;
      },
      // Pflichtfelder prüfen, Fehler am Feld zeigen. Gibt true zurück, wenn alles passt.
      pruefen() {
        let ok = true;
        for (const f of felder) {
          const box = bloecke.get(f.name).querySelector('.ffehler');
          box.textContent = '';
          if (!f.pflicht || (f.wenn && !f.wenn(werte))) continue;
          const w = werte[f.name];
          if (w == null || (typeof w === 'string' && !w.trim()) || (Array.isArray(w) && !w.length)) {
            box.textContent = f.fehlertext || 'Bitte ausfüllen.';
            ok = false;
          }
        }
        if (!ok) root.querySelector('.ffehler:not(:empty)')?.closest('.fblock')?.scrollIntoView({ block: 'center' });
        return ok;
      },
    };
  }

  // Fotos: verkleinert auf max. 1600 px, als JPEG. Höchstens f.max (Standard 5).
  function fotoFeld(f, werte) {
    werte[f.name] = werte[f.name] || [];
    const max = f.max || 5;
    const wrap = el('div.photo');
    const input = el('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true, onchange: async e => {
      for (const datei of e.target.files) if (werte[f.name].length < max) werte[f.name].push(await verkleinern(datei));
      e.target.value = '';
      zeichnen();
    } });
    function zeichnen() {
      BK.leeren(wrap);
      werte[f.name].forEach((blob, i) => {
        const url = URL.createObjectURL(blob);
        wrap.append(el('div.ph.img', el('img', { src: url, alt: 'Foto ' + (i + 1) }),
          el('button.ph-x', { type: 'button', 'aria-label': 'Foto entfernen', onclick: () => { werte[f.name].splice(i, 1); URL.revokeObjectURL(url); zeichnen(); } }, BK.icon('x'))));
      });
      if (werte[f.name].length < max) wrap.append(el('button.ph', { type: 'button', 'aria-label': 'Foto aufnehmen', onclick: () => input.click() }, BK.icon('cam')));
      wrap.append(input);
    }
    zeichnen();
    return el('div.list', wrap);
  }

  async function verkleinern(datei, kante = 1600) {
    const bild = await createImageBitmap(datei);
    const f = Math.min(1, kante / Math.max(bild.width, bild.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
    c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
    return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.8));
  }

  window.BK.formular = { bauen };
})();

(function () {
  'use strict';

// Modul Übersicht (Tablet): Ampel, was jetzt zu tun ist, Kacheln, aktuelle Meldungen, Geräte mit Prüffrist
BK.modul('uebersicht', {
  async start(root, ctx) {
    const { el, icon, api, leeren } = BK;
    let fz = ctx.fahrzeug;
    const ampel = root.querySelector('[data-ampel]');
    const tun = root.querySelector('[data-tun]');
    const liste = root.querySelector('[data-liste]');
    const geraeteBox = root.querySelector('[data-geraete]');
    const STATUS = { offen: 'Offen', in_bearbeitung: 'In Bearbeitung', erledigt: 'Erledigt' };

    // Ampel. Hat sie sich seit dem letzten Blick geändert, leuchtet sie kurz auf.
    function ampelZeigen() {
      const bereit = fz.ampel === 'einsatzbereit';
      const schluessel = 'bk_ampel_' + fz.id;
      let vorher = null;
      try { vorher = localStorage.getItem(schluessel); localStorage.setItem(schluessel, fz.ampel); } catch { /* privat */ }
      ampel.className = 'status ' + fz.ampel + (vorher && vorher !== fz.ampel ? ' aufleuchten' : '');
      leeren(ampel).append(
        el('div.dot', icon(bereit ? 'check' : 'alert')),
        el('div', el('h2', bereit ? 'Einsatzbereit' : 'Nicht einsatzbereit'),
          bereit ? null : el('p', [fz.ampel_grund, fz.ampel_am && 'seit ' + BK.datum(fz.ampel_am)].filter(Boolean).join(' · '))));
    }

    // Ein Satz: was das Team jetzt tun sollte
    function tunZeigen(checkliste, meldungen, frist) {
      const { tage, bis } = frist;
      let titel, text, ziel = null, warn = false;
      if (checkliste && checkliste.zurueck_grund && !checkliste.abgeschlossen_am) {
        [titel, text, ziel, warn] = ['Fahrzeug Überprüfung korrigieren', 'Zurück vom MPGler: ' + checkliste.zurueck_grund, 'checkliste', true];
      } else if (checkliste && !checkliste.abgeschlossen_am) {
        [titel, text, ziel] = ['Fahrzeug Überprüfung weitermachen', `Angefangen, aber noch nicht abgeschlossen. Fällig bis ${bis}.`, 'checkliste'];
      } else if (!checkliste && frist.bald) {
        [titel, text, ziel, warn] = [tage < 0 ? 'Fahrzeug Überprüfung überfällig' : `Fahrzeug Überprüfung fällig bis ${bis}`, 'Vollzähligkeit prüfen und abschließen.', 'checkliste', true];
      } else {
        tun.hidden = true;  // nichts steht an
        return;
      }
      tun.hidden = false;
      if (ziel && !(fz.module || []).includes(ziel)) ziel = null;
      leeren(tun).className = 'tun' + (warn ? ' warn' : ' ok');
      tun.append(...[el('div.tun-ic', icon(warn ? 'alert' : ziel ? 'list' : 'check')), el('div.t', el('b', titel), el('span', text)),
        ziel && el('button.btn', { type: 'button', onclick: () => ctx.oeffnen(ziel) }, 'Öffnen', icon('chevR'))].filter(Boolean));
    }

    const kachel = (modul, farbe, ic, titel) => (fz.module || []).includes(modul)
      ? el('button.tile', { type: 'button', onclick: () => ctx.oeffnen(modul) },
          el('div.ic', { class: 'ic ' + farbe }, icon(ic)), el('h3', titel))
      : null;
    root.querySelector('[data-kacheln]').append(
      kachel('mangel', 'f-rot', 'wrench', 'Mängelmeldung'),
      kachel('material', 'f-blau', 'box', 'Materialanforderung'),
      kachel('checkliste', 'f-navy', 'list', 'Fahrzeug Überprüfung'));

    async function laden() {
      try { fz = (await api.fahrzeug(fz.id)) || fz; } catch { /* alter Stand */ }
      ampelZeigen();
      try {
        const [alle, cl, fristen] = await Promise.all([api.meldungen({ fahrzeugId: fz.id, seitTagen: 60 }), api.checklisten({ fahrzeugId: fz.id }).catch(() => []), api.fristen().catch(() => [])]);
        const frist = BK.fristen.fuer(fristen, fz);
        const meldungen = alle.filter(m => m.status !== 'erledigt' || Date.now() - new Date(m.erledigt_am) < 7 * 864e5);
        tunZeigen(cl.find(c => c.zeitraum === frist.key), meldungen, frist);
        leeren(liste);
        if (!meldungen.length) liste.append(el('div.row', el('div', { class: 'ico f-gruen' }, icon('check')), el('div.t', el('b', 'Keine offenen Meldungen'))));
        for (const m of meldungen) {
          const titel = m.art === 'material'
            ? `Materialanforderung: ${m.positionen.length} Artikel`
            : [m.geraet ? m.geraet.name : (m.gegenstand || m.geraet_frei), m.beschreibung].filter(Boolean).join(': ');
          const farbe = m.status === 'erledigt' ? 'f-gruen' : m.art === 'material' ? 'f-blau' : m.status === 'offen' ? 'f-rot' : 'f-orange';
          liste.append(el('div.row',
            el('div', { class: 'ico ' + farbe }, icon(m.status === 'erledigt' ? 'check' : m.art === 'material' ? 'box' : 'wrench')),
            el('div.t', el('b', titel), el('span', [m.art === 'material' ? 'Materialanforderung' : 'Mängelmeldung', timeAgo(m.erstellt_am), m.gemeldet_von].join(' · '))),
            el('span', { class: 'pill ' + m.status }, STATUS[m.status])));
        }
      } catch (e) {
        leeren(liste).append(el('div.row', el('div.t', el('b', 'Liste lässt sich nicht laden.'), el('span', e.message))));
      }
    }

    // Geräte nach Prüffrist: überfällig rot, in 30 Tagen fällig orange
    async function geraeteZeigen() {
      try {
        const g = (await api.geraete(fz.id)).filter(x => x.pruefung_bis).sort((a, b) => a.pruefung_bis.localeCompare(b.pruefung_bis));
        leeren(geraeteBox);
        if (!g.length) return geraeteBox.append(el('div.row', el('div.t', el('b', 'Keine Geräte mit Prüffrist'))));
        const heute = new Date(); heute.setHours(0, 0, 0, 0);
        for (const x of g) {
          const tage = Math.round((new Date(x.pruefung_bis) - heute) / 864e5);
          const [klasse, text] = tage < 0 ? ['offen', 'Überfällig'] : tage <= 30 ? ['in_bearbeitung', tage === 0 ? 'Heute fällig' : `In ${tage} ${tage === 1 ? 'Tag' : 'Tagen'}`] : [null, null];
          geraeteBox.append(el('div.row',
            el('div', { class: 'ico ' + (klasse === 'offen' ? 'f-rot' : klasse ? 'f-orange' : 'f-navy') }, icon('clock')),
            el('div.t', el('b', x.name), el('span', [x.pruefart, 'Prüfung bis ' + BK.datum(x.pruefung_bis, false)].filter(Boolean).join(' · '))),
            text ? el('span', { class: 'pill ' + klasse }, text) : null));
        }
      } catch (e) {
        leeren(geraeteBox).append(el('div.row', el('div.t', el('b', 'Geräte lassen sich nicht laden.'), el('span', e.message))));
      }
    }

    BK.beiNeu(() => { laden(); geraeteZeigen(); });
    geraeteZeigen();
    await laden();
  },
});

// Modul Mangel melden (Tablet). Aufbau wie das Papierformular, nur für KTW.
BK.modul('mangel', {
  async start(root, ctx) {
    const { api } = BK;
    const fz = ctx.fahrzeug;

    const jetzt = new Date();
    const uhr = jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    root.querySelector('[data-kennzeichen]').textContent = fz.kennzeichen || '–';
    root.querySelector('[data-funkruf]').textContent = fz.name;
    root.querySelector('[data-datum]').textContent = jetzt.toLocaleDateString('de-DE');
    root.querySelector('[data-zeit]').textContent = uhr;

    let geraete = [];
    try { geraete = await api.geraete(fz.id); } catch { /* ohne Netz und ohne Vorrat: nur „Anderes Gerät“ */ }
    const geraetText = g => [g.name, g.seriennummer && 'SN ' + g.seriennummer].filter(Boolean).join(' · ');

    const FELDER = [
      { name: 'betrifft', typ: 'segment', label: 'Art', pflicht: true, standard: 'fahrzeug',
        optionen: [['fahrzeug', 'KTW'], ['mpg', 'MPG']] },
      { name: 'gegenstand', typ: 'text', label: 'Gegenstand', pflicht: true, max: 200,
        platzhalter: 'z. B. Trage, Schiebetür, Blaulicht', wenn: w => w.betrifft === 'fahrzeug' },
      { name: 'geraet_id', typ: 'auswahl', label: 'MPG: SN', pflicht: true, platzhalter: 'Gerät wählen',
        optionen: [...geraete.map(g => [g.id, geraetText(g)]), ['anders', 'Anderes Gerät']],
        hinweis: 'Seriennummer und Hersteller kommen aus der Geräteliste dieses KTW.', wenn: w => w.betrifft === 'mpg' },
      { name: 'geraet_frei', typ: 'text', label: 'Welches Gerät?', pflicht: true, max: 120,
        platzhalter: 'Name und Seriennummer', wenn: w => w.betrifft === 'mpg' && w.geraet_id === 'anders' },
      { name: 'beschreibung', typ: 'textarea', label: 'Beschreibung', pflicht: true, max: 2000,
        platzhalter: 'Kurz beschreiben, was nicht funktioniert.' },
      { name: 'fotos', typ: 'fotos', label: 'Fotos', max: 5, hinweis: 'Höchstens 5 Fotos.' },
      { name: 'gemeldet_von', typ: 'text', label: 'Gemeldet durch', pflicht: true, max: 100,
        platzhalter: 'Vor- und Nachname', autocomplete: 'name', standard: ctx.ich.rolle ? ctx.ich.name : undefined },
    ];

    const formBox = root.querySelector('[data-formular]');
    const form = BK.formular.bauen(formBox, FELDER);
    let gesendet = false;
    // Nur echte Eingaben zählen (Tippen, Foto, Auswahl), Vorbelegungen nicht
    let beruehrt = false;
    for (const t of ['input', 'change']) formBox.addEventListener(t, e => { if (e.isTrusted) beruehrt = true; }, true);
    BK.vorVerlassen = async () => gesendet || !beruehrt
      || await confirmDialog('Mängelmeldung nicht gesendet', 'Du hast schon etwas eingetragen. Ohne Senden geht es verloren. Trotzdem verlassen?');
    // Kopfzeile wie auf dem Blatt direkt unter „Art“
    formBox.firstElementChild.after(root.querySelector('[data-kopf]'));
    const knopf = root.querySelector('[data-senden]');


    knopf.onclick = async () => {
      if (!form.pruefen()) return;
      const w = form.werte();
      if (w.gemeldet_von.length < 2) return alertDialog('Name zu kurz', 'Bitte Vor- und Nachnamen eintragen.');
      knopf.disabled = true; knopf.classList.add('laedt');
      try {
        const vomMac = !!ctx.ich.rolle;
        const r = await (vomMac ? api.meldungAnlegen : api.meldungMelden)({
          art: 'mangel',
          fahrzeug_id: fz.id,
          betrifft: w.betrifft,
          gegenstand: w.betrifft === 'fahrzeug' ? w.gegenstand : null,
          geraet_id: w.betrifft === 'mpg' && w.geraet_id !== 'anders' ? w.geraet_id : null,
          geraet_frei: w.betrifft === 'mpg' && w.geraet_id === 'anders' ? w.geraet_frei : null,
          beschreibung: w.beschreibung,
          gemeldet_von: w.gemeldet_von,
        }, w.fotos || []);
        if (vomMac) showToast(`Mängelmeldung für ${fz.name} gesendet`);
        else await (r.gesendet
          ? erfolg('Gesendet', 'Die MPGler sehen die Mängelmeldung jetzt in ihrer Liste.')
          : erfolg('Gespeichert', 'Kein Netz. Die Mängelmeldung wird gesendet, sobald Netz da ist. Bitte nicht noch einmal melden.', 4000, 'wartet'));
        gesendet = true;
        ctx.oeffnen('uebersicht');
      } catch (e) {
        knopf.disabled = false; knopf.classList.remove('laedt');
        alertDialog('Nicht gespeichert', e.message);
      }
    };
  },
});

// Modul Material anfordern (Tablet). Zwei Wege: Artikel suchen oder die Liste der Checkliste durchgehen und Mengen setzen.
BK.modul('material', {
  async start(root, ctx) {
    const { el, icon, api, leeren } = BK;
    const fz = ctx.fahrzeug;
    const zeilenBox = root.querySelector('[data-zeilen]');
    const katBox = root.querySelector('[data-katalog]');
    const name = root.querySelector('#mat_name');
    if (ctx.ich.rolle) name.value = ctx.ich.name || '';
    const knopf = root.querySelector('[data-senden]');
    const MAX = 30;
    const GRUND = [['verbraucht', 'Verbraucht'], ['abgelaufen', 'Abgelaufen']];
    const zeilen = [];  // { artikel, groesse, menge, grund }
    let bereiche = [], namen = [], weg = 'suchen', filter = '', gesendet = false;
    BK.vorVerlassen = async () => gesendet || !zeilen.some(z => z.artikel.trim())
      || await confirmDialog('Materialanforderung nicht gesendet', 'Du hast schon Artikel eingetragen. Ohne Senden gehen sie verloren. Trotzdem verlassen?');
    const suche = root.querySelector('[data-katalog-suche]');
    suche.oninput = () => { filter = suche.value.trim().toLowerCase(); zeichnenListe(); };

    const grundWahl = z => el('div.segc.grund', { role: 'radiogroup', 'aria-label': 'Grund' },
      GRUND.map(([w, t]) => el('button', { type: 'button', role: 'radio', 'aria-checked': String(z.grund === w), class: z.grund === w ? 'on' : null,
        onclick: () => { z.grund = w; zeichnen(); } }, t)));

    const stepper = (wert, setzen, min) => el('div.stepper',
      el('button', { type: 'button', 'aria-label': 'weniger', disabled: wert <= min, onclick: () => setzen(wert - 1) }, icon('minus')),
      el('span.q', String(wert)),
      el('button', { type: 'button', 'aria-label': 'mehr', disabled: wert >= 999, onclick: () => setzen(wert + 1) }, icon('plus')));

    // Große Vorschlagsliste unter dem Artikelfeld (statt der kleinen Browser-Liste)
    function vorschlaege(input, z) {
      const box = el('div.mat-vorschlag', { role: 'listbox', hidden: true });
      const fuellen = () => {
        const q = input.value.trim().toLowerCase();
        const treffer = q ? namen.filter(n => n.toLowerCase().includes(q) && n.toLowerCase() !== q).slice(0, 8) : [];
        leeren(box).append(...treffer.map(n => el('button', { type: 'button', role: 'option',
          onpointerdown: e => e.preventDefault(),
          onclick: () => { z.artikel = n; input.value = n; box.hidden = true; } }, n)));
        box.hidden = !treffer.length;
      };
      input.addEventListener('input', () => { z.artikel = input.value; fuellen(); });
      input.addEventListener('focus', fuellen);
      input.addEventListener('blur', () => { box.hidden = true; });
      input.addEventListener('keydown', e => { if (e.key === 'Escape') box.hidden = true; });
      return box;
    }

    function zeichnenSuchen() {
      leeren(zeilenBox);
      zeilen.forEach((z, i) => {
        const feld = el('input.field', { maxlength: 120, placeholder: 'Artikel suchen oder eintippen', value: z.artikel, autocomplete: 'off', 'aria-label': 'Artikel ' + (i + 1) });
        zeilenBox.append(el('div.row.mz',
          el('div.t',
            el('div.mat-suche', feld, vorschlaege(feld, z)),
            el('input.field.klein', { maxlength: 40, placeholder: 'Größe (optional)', value: z.groesse, 'aria-label': 'Größe',
              oninput: e => { z.groesse = e.target.value; } })),
          grundWahl(z),
          stepper(z.menge, w => { z.menge = w; zeichnen(); }, 1),
          el('button.mz-weg', { type: 'button', 'aria-label': 'Zeile entfernen', onclick: () => { zeilen.splice(i, 1); zeichnen(); } }, icon('x'))));
      });
      if (zeilen.length < MAX) zeilenBox.append(el('button.row.mz-neu', { type: 'button', onclick: () => neu() }, icon('plus'), el('span', 'Artikel hinzufügen')));
    }

    // Liste wie in der Checkliste: Menge 0 = nicht angefordert
    function zeichnenListe() {
      leeren(katBox);
      if (!bereiche.length) { katBox.append(el('div.foot', 'Für diesen KTW gibt es keine Checkliste.')); return; }
      let treffer = 0;
      for (const b of bereiche) {
        const pos = b.positionen.filter(p => p.aktiv !== false && (!filter || p.artikel.toLowerCase().includes(filter)));
        if (!pos.length) continue;
        treffer += pos.length;
        katBox.append(el('div.sect.mat-bereich', el('span', { class: 'streifen ' + (b.farbe || '') }), b.name));
        katBox.append(el('div.list', pos.map(p => {
          const z = zeilen.find(x => x.artikel === p.artikel);
          const menge = z ? z.menge : 0;
          const setzen = w => {
            if (w <= 0) { if (z) zeilen.splice(zeilen.indexOf(z), 1); }
            else if (z) z.menge = w;
            else if (zeilen.filter(x => x.artikel.trim()).length < MAX) {
              const leer = zeilen.findIndex(x => !x.artikel.trim());
              if (leer >= 0) zeilen.splice(leer, 1);
              zeilen.push({ artikel: p.artikel, groesse: '', menge: w, grund: 'verbraucht' });
            }
            zeichnen();
          };
          return el('div.row.mk' + (menge ? '.an' : ''),
            el('div.t', el('b', p.artikel), BK.lfd(p).text ? el('span', BK.lfd(p).text) : null),
            z ? grundWahl(z) : null,
            stepper(menge, setzen, 0));
        })));
      }
      if (!treffer) katBox.append(el('div.foot', 'Kein Artikel gefunden.'));
    }

    function zeichnen() {
      if (!zeilen.length) zeilen.push({ artikel: '', groesse: '', menge: 1, grund: 'verbraucht' });
      for (const b of root.querySelectorAll('[data-weg] button')) {
        const an = b.dataset.v === weg;
        b.classList.toggle('on', an); b.setAttribute('aria-selected', String(an));
      }
      zeilenBox.hidden = weg !== 'suchen';
      katBox.hidden = suche.hidden = weg !== 'liste';
      weg === 'suchen' ? zeichnenSuchen() : zeichnenListe();
    }
    for (const b of root.querySelectorAll('[data-weg] button')) b.onclick = () => { weg = b.dataset.v; zeichnen(); };

    function neu() {
      zeilen.push({ artikel: '', groesse: '', menge: 1, grund: 'verbraucht' });
      zeichnen();
      zeilenBox.querySelectorAll('.mat-suche input')[zeilen.length - 1]?.focus();
    }

    // Artikel der Checkliste: Vorschläge und Liste
    if (fz.vorlage_id) api.vorlage(fz.vorlage_id).then(b => {
      bereiche = b.filter(x => x.aktiv !== false);
      namen = [...new Set(bereiche.flatMap(x => x.positionen.map(p => p.artikel)))].sort((a, c) => a.localeCompare(c, 'de'));
      if (weg === 'liste') zeichnen();
    }).catch(() => { /* ohne Liste geht es auch */ });

    // Aus der Checkliste übergeben: fehlende Artikel schon eingetragen
    const vorgaben = (ctx.extra && ctx.extra.positionen) || [];
    vorgaben.slice(0, MAX).forEach(p => zeilen.push({ artikel: p.artikel, groesse: '', menge: Math.max(1, p.menge || 1), grund: p.grund || 'verbraucht' }));
    if (!zeilen.length) zeilen.push({ artikel: '', groesse: '', menge: 1, grund: 'verbraucht' });
    zeichnen();

    knopf.onclick = async () => {
      const fehlerZ = root.querySelector('[data-fehler-zeilen]');
      const fehlerN = root.querySelector('[data-fehler-name]');
      const positionen = zeilen.filter(z => z.artikel.trim())
        .map(z => ({ artikel: z.artikel.trim(), groesse: z.groesse.trim() || null, menge: z.menge, grund: z.grund }));
      fehlerZ.textContent = positionen.length ? '' : 'Bitte mindestens einen Artikel eintragen.';
      fehlerN.textContent = name.value.trim().length >= 2 ? '' : 'Bitte Vor- und Nachnamen eintragen.';
      if (fehlerZ.textContent || fehlerN.textContent) return;
      knopf.disabled = true; knopf.classList.add('laedt');
      try {
        const vomMac = !!ctx.ich.rolle;
        const r = await (vomMac ? api.meldungAnlegen : api.meldungMelden)({ art: 'material', fahrzeug_id: fz.id, gemeldet_von: name.value.trim(), positionen });
        if (vomMac) showToast(`Materialanforderung für ${fz.name} gesendet`);
        else await (r.gesendet
          ? erfolg('Gesendet', 'Die MPGler sehen die Materialanforderung jetzt in ihrer Liste.')
          : erfolg('Gespeichert', 'Kein Netz. Die Materialanforderung wird gesendet, sobald Netz da ist. Bitte nicht noch einmal anfordern.', 4000, 'wartet'));
        gesendet = true;
        ctx.oeffnen('uebersicht');
      } catch (e) {
        knopf.disabled = false; knopf.classList.remove('laedt');
        alertDialog('Nicht gespeichert', e.message);
      }
    };
  },
});

;
// Modul Checkliste (Tablet). Alles gilt als vollständig, man tippt nur an, was fehlt oder abläuft.
BK.modul('checkliste', {
  async start(root, ctx) {
    const { el, icon, api, leeren } = BK;
    const fz = ctx.fahrzeug;
    const box = root.querySelector('[data-ckl]');
    const zeitraumText = BK.fristen.zeitraumText;

    const meldung = (titel, text, knopf) => leeren(box).append(el('div.ckl-start',
      el('span.logo-platzhalter.gross', icon('list')), el('h1', titel), ...[].concat(text), knopf || null));

    if (!fz.vorlage_id) return meldung('Keine Checkliste', 'Für diesen KTW ist noch keine Checkliste hinterlegt.');

    let bereiche, liste, fristen, vorlagen;
    try {
      [bereiche, liste, fristen, vorlagen] = await Promise.all([api.vorlage(fz.vorlage_id), api.checklisten({ fahrzeugId: fz.id, offen: true }), api.fristen().catch(() => []), api.vorlagen().catch(() => [])]);
    } catch (e) {
      return meldung('Checkliste lässt sich nicht laden', e.offline ? 'Kein Netz und noch nichts auf dem Tablet gespeichert.' : e.message);
    }
    bereiche = bereiche.filter(b => b.positionen.length);
    const listeFeuerwehr = (vorlagen.find(v => v.id === fz.vorlage_id) || {}).liste_feuerwehr;
    const frist = BK.fristen.fuer(fristen, fz);
    const zeitraum = frist.key;
    const offen = liste.find(c => !c.abgeschlossen_am);
    const wartet = liste.find(c => c.abgeschlossen_am);

    if (!offen) {
      const knopf = el('button.btn', { type: 'button', onclick: async () => {
        knopf.disabled = true; knopf.classList.add('laedt');
        try { await api.checklisteStarten(zeitraum); ctx.oeffnen('checkliste'); }
        catch (e) { knopf.disabled = false; knopf.classList.remove('laedt'); alertDialog('Hat nicht geklappt', e.offline ? 'Zum Beginnen braucht das Tablet einmal Netz. Danach geht alles auch offline.' : e.message); }
      } }, 'Checkliste beginnen');
      return meldung('Fahrzeug Überprüfung',
        [el('p', '§ 20 Abs. 2 HmbRDG Überprüfung von Krankentransportwagen'),
          el('p', `${zeitraumText(zeitraum)}, fällig bis ${frist.bis}`),
          wartet ? el('p', `Die letzte Checkliste (${zeitraumText(wartet.zeitraum)}) wartet auf die Gegenzeichnung.`) : null],
        knopf);
    }

    // Stand: Einträge vom Server, lokal ergänzt (falls ohne Netz geändert)
    const SPEICHER = 'bk_ckl:' + offen.id;
    let lokal = {};
    try { lokal = JSON.parse(localStorage.getItem(SPEICHER)) || {}; } catch { /* leer */ }
    const eintraege = Object.fromEntries((offen.eintraege || []).map(e => [e.position_id, e]));
    Object.assign(eintraege, lokal.eintraege || {});
    // Je Position abgehakt (vorhanden). Abweichungen zählen auch als geprüft.
    const ok = new Set(lokal.ok || []);
    const istGeprueft = p => ok.has(p.id) || !!eintraege[p.id];
    const bereichFertig = b => b.positionen.every(istGeprueft);
    for (const k of Object.keys(eintraege)) if (eintraege[k] === null) delete eintraege[k];
    const sichern = () => { try { localStorage.setItem(SPEICHER, JSON.stringify({ eintraege: lokal.eintraege || {}, ok: [...ok] })); } catch { /* voll */ } };
    const lokalSetzen = (pid, wert) => { lokal.eintraege = lokal.eintraege || {}; lokal.eintraege[pid] = wert; sichern(); };

    let aktiv = 0;
    let offenePosition = null;
    const gesamt = bereiche.reduce((n, b) => n + b.positionen.length, 0);
    const abweichungen = b => b.positionen.filter(p => eintraege[p.id]).length;

    const side = el('aside.ckl-side');
    const main = el('section.ckl-main');
    leeren(box).append(side, main);

    // Neu zeichnen, ohne dass die Listen nach oben springen
    function seite() {
      const pos = [side.scrollTop, main.querySelector('.content')?.scrollTop || 0];
      zeichnen();
      side.scrollTop = pos[0];
      const c = main.querySelector('.content'); if (c) c.scrollTop = pos[1];
    }

    function zeichnen() {
      // Linke Spalte
      const n = bereiche.reduce((s, b) => s + b.positionen.filter(istGeprueft).length, 0);
      leeren(side).append(
        el('h2', 'Checkliste'),
        el('div.foot.ckl-zeitraum', zeitraumText(offen.zeitraum)),
        offen.zurueck_grund ? el('p.red.ckl-zurueck', 'Zurück vom MPGler: ' + offen.zurueck_grund) : '',
        el('div.ckl-stand', el('span', `${n} von ${gesamt} geprüft`), el('span', 'seit ' + new Date(offen.begonnen_am).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }))),
        el('div.progress', el('i', { style: `width:${Math.round(n / gesamt * 100)}%` })),
        ...bereiche.flatMap((b, i) => {
          const abw = abweichungen(b);
          // Unterüberschrift wie auf dem Papier (Patientenraum, Notfallrucksack …), sobald die Gruppe wechselt
          const kopf = b.gruppe && b.gruppe !== (bereiche[i - 1] || {}).gruppe ? el('div.ckl-gruppe', b.gruppe) : null;
          return [kopf, el('button', { type: 'button', class: `area ${b.farbe || ''} ${i === aktiv ? 'on' : ''}`, onclick: () => { aktiv = i; offenePosition = null; seite(); } },
            b.name, el('span', abw ? el('b.abw', abw + ' offen') : null, bereichFertig(b) ? icon('check') : `${b.positionen.filter(istGeprueft).length}/${b.positionen.length}`))].filter(Boolean);
        }),
        el('button', { type: 'button', class: 'area' + (aktiv === bereiche.length ? ' on' : ''), onclick: () => { aktiv = bereiche.length; seite(); } }, 'Abschließen', el('span', icon('chevR'))));

      if (aktiv === bereiche.length) return abschluss();
      const b = bereiche[aktiv];
      const fehlend = b.positionen.filter(p => eintraege[p.id] && eintraege[p.id].ist != null && eintraege[p.id].ist < p.soll);
      const alleDa = b.positionen.every(istGeprueft);
      // Spalten wie MPG.doc, Kopf bleibt beim Scrollen stehen
      const zeilen = el('div.list.ck-liste', el('div.ck-spalten', el('span', 'Vorh.'), el('span', 'Artikel, SN und Hersteller'),
        el('span.zahl', 'Anzahl soll'), el('span.zahl', 'Anzahl ist'), el('span.ck-frist', 'Verfallsdatum, STK/MTK'), el('span.ck-wo', 'Wo')));
      for (const p of b.positionen) zeilen.append(zeile(p, b));
      leeren(main).append(
        el('div.content',
          el('div', { class: 'ckl-kopf ' + (b.farbe || '') }, el('span', { class: 'streifen ' + (b.farbe || '') }),
            el('div.ckl-titel', el('h2', b.name), el('span', [b.gruppe, `Bereich ${aktiv + 1} von ${bereiche.length}`].filter(Boolean).join(' · '))),
            fehlend.length ? el('button.btn.sec', { type: 'button', onclick: () => ctx.oeffnen('material', {
              positionen: fehlend.map(p => ({ artikel: p.artikel, menge: p.soll - eintraege[p.id].ist })) }) }, icon('box'), 'Fehlendes anfordern') : null),
          zeilen,
          el('div.ckl-alle', el('button.btn.sec', { type: 'button', onclick: () => {
            b.positionen.forEach(p => alleDa ? ok.delete(p.id) : ok.add(p.id)); sichern(); seite();
          } }, icon('check'), alleDa ? 'Haken im Bereich entfernen' : 'Alle im Bereich vorhanden')),
          el('div.foot', 'Hake ab, was vorhanden ist. Tippe auf den Namen, wenn etwas fehlt, defekt ist oder bald abläuft.')),
        el('div.bottombar',
          aktiv > 0 ? el('button.btn.sec', { type: 'button', onclick: () => gehe(aktiv - 1) }, icon('chevL'), bereiche[aktiv - 1].name) : null,
          el('span.sp'),
          el('button.btn', { type: 'button', onclick: () => gehe(aktiv + 1) },
            aktiv + 1 < bereiche.length ? 'Weiter zu ' + bereiche[aktiv + 1].name : 'Weiter zum Abschluss', icon('chevR'))));
    }

    function gehe(i) { aktiv = i; offenePosition = null; seite(); main.querySelector('.content')?.scrollTo(0, 0); }

    const monat = d => new Date(d).toLocaleDateString('de-DE', { month: '2-digit', year: 'numeric' });
    // Spalte „Verfallsdatum, STK/MTK“: eingetragenes Datum, sonst die Prüffrist aus der Liste
    const fristText = (p, e) => e && e.verfall ? monat(e.verfall) : BK.lfd(p).frist || { verfall: 'Verfall', stk: 'STK', mtk: 'MTK' }[p.pruefart] || '';

    function zeile(p, b) {
      const e = eintraege[p.id];
      const da = ok.has(p.id);
      const durch = !!(e && e.durchgestrichen);
      const haken = el('button', { type: 'button', class: 'box' + (durch ? ' durch' : e ? ' warn' : da ? ' an' : ' aus'), 'aria-pressed': String(!!(e || da)),
        'aria-label': p.artikel + (da ? ': Haken entfernen' : ': vorhanden'), onclick: ev => {
          ev.stopPropagation();
          if (e) { offenePosition = p.id; return seite(); }
          da ? ok.delete(p.id) : ok.add(p.id); sichern(); seite();
        } }, durch ? icon('minus') : e ? icon('alert') : da ? icon('check') : null);
      const l = BK.lfd(p);
      const zweite = durch ? (e.bemerkung ? 'Nicht vorhanden · ' + e.bemerkung : 'Nicht vorhanden') : e && e.bemerkung ? e.bemerkung : l.text;
      const wrap = el('div', { class: 'ck-wrap ' + (b.farbe || '') + (durch ? ' durch' : e ? ' dev' : '') },
        el('div.ck', haken, el('button.ck-text', { type: 'button', 'aria-expanded': String(offenePosition === p.id), onclick: () => { offenePosition = offenePosition === p.id ? null : p.id; seite(); } },
          el('div.t', el('b', p.artikel + (p.optional ? ' (falls vorhanden)' : '')), zweite ? el('span', zweite) : null),
          el('span.zahl', String(p.soll)),
          el('span', { class: 'zahl ist' + (e && e.ist != null ? ' warnt' : '') }, e && e.ist != null ? String(e.ist) : ''),
          el('span', { class: 'ck-frist' + (e && e.verfall ? ' warnt' : '') }, fristText(p, e)),
          el('span.ck-wo', p.wo || ''))));
      if (offenePosition === p.id) wrap.append(editor(p, e));
      return wrap;
    }

    function editor(p, e) {
      let ist = e && e.ist != null ? e.ist : p.soll;
      const q = el('span.q', String(ist));
      const verfall = el('input.field', { type: 'month', value: e && e.verfall ? e.verfall.slice(0, 7) : '', 'aria-label': 'Verfallsdatum' });
      const bem = el('input.field', { maxlength: 300, placeholder: 'z. B. defekt, Fülldruck unter 100 bar', value: (e && e.bemerkung) || '', 'aria-label': 'Bemerkung' });
      const speichern = async (entfernen, durchstreichen = false) => {
        const neu = entfernen ? null : durchstreichen
          ? { position_id: p.id, ist: null, verfall: null, bemerkung: bem.value.trim() || null, durchgestrichen: true }
          : { position_id: p.id, ist: ist === p.soll ? null : ist, verfall: verfall.value ? verfall.value + '-01' : null, bemerkung: bem.value.trim() || null };
        if (neu && !neu.durchgestrichen && neu.ist == null && !neu.verfall && !neu.bemerkung) return speichern(true);
        if (neu) eintraege[p.id] = neu; else { delete eintraege[p.id]; ok.add(p.id); sichern(); }
        lokalSetzen(p.id, neu);
        offenePosition = null;
        seite();
        try { await api.checklisteEintrag(offen.id, p.id, neu || { entfernen: true }); showToast(!neu ? `${p.artikel}: vollständig` : neu.durchgestrichen ? `${p.artikel}: nicht vorhanden` : `${p.artikel}: Abweichung gemerkt`); }
        catch (err) { alertDialog('Nicht gespeichert', err.message); }
      };
      return el('div.ck-edit',
        el('span', 'Anzahl ist'),
        el('div', el('div.stepper',
          el('button', { type: 'button', 'aria-label': 'weniger', onclick: () => { if (ist > 0) q.textContent = --ist; } }, icon('minus')), q,
          el('button', { type: 'button', 'aria-label': 'mehr', onclick: () => { if (ist < 999) q.textContent = ++ist; } }, icon('plus')))),
        p.pruefart !== 'keine' ? el('span', p.pruefart === 'verfall' ? 'Verfall' : 'Prüfung bis') : null,
        p.pruefart !== 'keine' ? verfall : null,
        el('span', 'Bemerkung'), bem,
        el('div.acts',
          e ? el('button.btn.sec', { type: 'button', onclick: () => speichern(true) }, 'Doch vollständig') : null,
          e && e.durchgestrichen ? null : el('button.btn.sec', { type: 'button', title: 'Wie auf Papier durchstreichen: bekannt, nicht vorhanden', onclick: () => speichern(false, true) }, 'Nicht vorhanden'),
          el('button.btn', { type: 'button', onclick: () => speichern(false) }, 'Übernehmen')));
    }

    function abschluss() {
      const n = Object.values(eintraege).filter(x => x && !x.durchgestrichen).length;
      const m1 = el('input.field', { id: 'ckl_m1', maxlength: 100, autocomplete: 'off', placeholder: 'Vor- und Nachname' });
      const m2 = el('input.field', { id: 'ckl_m2', maxlength: 100, autocomplete: 'off', placeholder: 'Vor- und Nachname' });
      const fehler = el('div.ffehler', { role: 'alert' });
      const nichtGeprueft = bereiche.flatMap(b => b.positionen).filter(p => !istGeprueft(p));
      const knopf = el('button.btn', { type: 'button', onclick: async () => {
        if (m1.value.trim().length < 2 || m2.value.trim().length < 2) { fehler.textContent = 'Bitte beide Namen eintragen.'; return; }
        if (nichtGeprueft.length && !await confirmDialog('Noch nicht alles geprüft', `${nichtGeprueft.length} Positionen sind noch nicht abgehakt. Trotzdem abschließen?`)) return;
        knopf.disabled = true; knopf.classList.add('laedt');
        try {
          const r = await api.checklisteAbschliessen(offen.id, m1.value.trim(), m2.value.trim());
          try { localStorage.removeItem(SPEICHER); } catch { /* egal */ }
          await (r.gesendet
            ? erfolg('Abgeschlossen', 'Der MPGler zeichnet die Fahrzeug Überprüfung jetzt gegen.')
            : erfolg('Gespeichert', 'Kein Netz. Die Fahrzeug Überprüfung wird gesendet, sobald Netz da ist.', 4000, 'wartet'));
          ctx.oeffnen('uebersicht');
        } catch (e) { knopf.disabled = false; knopf.classList.remove('laedt'); alertDialog('Nicht gespeichert', e.message); }
      } }, 'Abschließen');
      const tag = d => new Date(d).toLocaleDateString('de-DE');
      const kv = (k, v) => el('div', el('span', k), el('b', v || '–'));
      leeren(main).append(el('div.content',
        el('div.ckl-kopf', el('div.ckl-titel', el('h2', 'Abschließen'), el('span', 'Fahrzeug Überprüfung'))),
        // Kopf wie Seite 1 der Papierliste
        el('div.ckl-blatt',
          kv('Datum der Überprüfung', tag(offen.begonnen_am)),
          kv('Liste Feuerwehr', listeFeuerwehr),
          kv('KTW', fz.name),
          kv('Amtliches Kennzeichen', fz.kennzeichen)),
        el('div.list', el('div.row', el('div.t', el('b', n === 1 ? '1 Abweichung' : n ? `${n} Abweichungen` : 'Keine Abweichung'),
          el('span', `${gesamt - n} von ${gesamt} Positionen vollständig`)))),
        // Unterschriften wie Seite 13
        el('div.ckl-sig',
          el('label', { for: 'ckl_m1' }, 'Unterschrift Mitarbeiter 1'), m1,
          el('label', { for: 'ckl_m2' }, 'Unterschrift Mitarbeiter 2'), m2,
          el('span', 'Gegengezeichnet MPG-Beauftragter'), el('b.leer', 'folgt nach dem Abschließen'),
          el('span', 'Datum'), el('b', tag(new Date()))),
        fehler,
        el('div.foot', 'Statt einer Unterschrift speichern wir Namen, Uhrzeit und Tablet.'),
        el('div.ckl-legende', el('span', 'Legende:'),
          ...[['blau', 'Sauerstoff'], ['orange', 'Hygiene'], ['rot', 'Wundversorgung'], ['gruen', 'Diagnostik'], ['gelb', 'Immobilisation']]
            .map(([f, t]) => el('span', el('i', { class: f }), t))),
        el('div.acts.links', knopf)));
    }

    seite();
  },
});

;
// Modul Checkliste (Tablet): Soll-Ausstattung des KTW zum Nachschauen. Haken nur auf diesem Tablet, nichts wird gesendet.
BK.modul('sollliste', {
  async start(root, ctx) {
    const { el, icon, api, leeren } = BK;
    const fz = ctx.fahrzeug;
    const box = root.querySelector('[data-liste]');
    const suche = root.querySelector('[data-suche]');
    const stand = root.querySelector('[data-stand]');
    const zurueck = root.querySelector('[data-zuruecksetzen]');
    const SPEICHER = 'bk_sollliste_' + fz.id;
    let bereiche = [], haken = new Set();
    try { haken = new Set(JSON.parse(localStorage.getItem(SPEICHER) || '[]')); } catch { /* privat */ }
    const merken = () => { try { localStorage.setItem(SPEICHER, JSON.stringify([...haken])); } catch { /* voll */ } };

    function zeichnen() {
      const q = suche.value.trim().toLowerCase();
      const alle = bereiche.flatMap(b => b.positionen);
      stand.textContent = haken.size ? `${alle.filter(p => haken.has(p.id)).length} von ${alle.length} abgehakt` : `${alle.length} Artikel`;
      zurueck.hidden = !haken.size;
      leeren(box);
      let treffer = 0;
      bereiche.forEach((b, i) => {
        const pos = b.positionen.filter(p => !q || p.artikel.toLowerCase().includes(q));
        if (!pos.length) return;
        treffer += pos.length;
        if (b.gruppe && b.gruppe !== (bereiche[i - 1] || {}).gruppe && !q) box.append(el('div.sl-gruppe', b.gruppe));
        box.append(el('div.sect.sl-bereich', el('span', { class: 'streifen ' + (b.farbe || '') }), b.name));
        box.append(el('div.list', pos.map(p => {
          const an = haken.has(p.id);
          const l = BK.lfd(p);
          return el('button', { type: 'button', class: 'row sl-zeile' + (an ? ' an' : ''), 'aria-pressed': String(an),
            onclick: () => { an ? haken.delete(p.id) : haken.add(p.id); merken(); zeichnen(); } },
            el('span.sl-box', an ? icon('check') : null),
            el('div.t', el('b', p.artikel + (p.optional ? ' (falls vorhanden)' : '')), l.text ? el('span', l.text) : null),
            p.wo ? el('span.sl-wo', p.wo) : null,
            el('span.sl-soll', { 'aria-label': 'Soll ' + p.soll }, String(p.soll)));
        })));
      });
      if (!treffer) box.append(el('div.foot', q ? 'Kein Artikel gefunden.' : 'Für diesen KTW gibt es keine Liste.'));
    }

    suche.oninput = zeichnen;
    zurueck.onclick = async () => {
      if (!await confirmDialog('Alle Haken entfernen?', 'Die Haken gibt es nur auf diesem Tablet.')) return;
      haken.clear(); merken(); zeichnen();
    };

    if (!fz.vorlage_id) return zeichnen();
    try {
      bereiche = (await api.vorlage(fz.vorlage_id))
        .filter(b => b.aktiv !== false)
        .map(b => ({ ...b, positionen: b.positionen.filter(p => p.aktiv !== false) }))
        .filter(b => b.positionen.length);
    } catch (e) { box.append(el('div.foot', 'Liste lässt sich nicht laden: ' + e.message)); return; }
    zeichnen();
  },
});

;
// Modul Verlauf (Tablet): was noch nicht gesendet ist, darunter alles, was an diesem KTW passiert ist.
(function () {
  let abmelden = null;

  // Text für einen Verlaufseintrag. m = Meldung (falls vorhanden)
  const AKTION = {
    gemeldet: (d, m) => [m && m.art === 'material' ? 'Materialanforderung' : 'Mängelmeldung', 'wrench'],
    status: d => [{ offen: 'Wieder offen', in_bearbeitung: 'In Bearbeitung', erledigt: 'Erledigt' }[d.nach] || 'Status geändert', d.nach === 'erledigt' ? 'check' : 'wrench'],
    bearbeitet: () => ['Bearbeitet', 'pen'],
    ausgegeben: () => ['Material ausgegeben', 'box'],
    teilweise_ausgegeben: () => ['Material zum Teil ausgegeben', 'box'],
    ampel: d => [d.ampel === 'einsatzbereit' ? 'Einsatzbereit gesetzt' : 'Nicht einsatzbereit gesetzt', d.ampel === 'einsatzbereit' ? 'check' : 'alert'],
    checkliste_begonnen: () => ['Checkliste begonnen', 'list'],
    checkliste_abgeschlossen: () => ['Checkliste abgeschlossen', 'list'],
    gegengezeichnet: () => ['Checkliste gegengezeichnet', 'check'],
    checkliste_zurueck: () => ['Checkliste zurück ans Team', 'list'],
    tablet_gekoppelt: () => ['Tablet gekoppelt', 'tablet'],
    tablet_entkoppelt: () => ['Tablet entkoppelt', 'tablet'],
    tablet_angelegt: () => ['Tablet angelegt', 'tablet'],
    tablet_neuer_code: () => ['Neuer Kopplungscode', 'tablet'],
    tablet_bearbeitet: () => ['Tablet bearbeitet', 'tablet'],
    tablet_gesperrt: () => ['Tablet gesperrt', 'tablet'],
    tablet_entsperrt: () => ['Tablet entsperrt', 'tablet'],
    fahrzeug_ausgeblendet: () => ['KTW ausgeblendet', 'alert'],
    meldung_geloescht: d => [d.art === 'material' ? 'Materialanforderung gelöscht' : 'Mängelmeldung gelöscht', 'alert'],
    checkliste_geloescht: () => ['Checkliste gelöscht', 'list'],
  };
  const FARBE = { wrench: 'f-rot', box: 'f-blau', list: 'f-navy', check: 'f-gruen', alert: 'f-rot', pen: 'f-orange', tablet: 'f-navy' };

  BK.modul('verlauf', {
    async start(root, ctx) {
      const { el, icon, api, leeren } = BK;
      const fz = ctx.fahrzeug;
      const qBox = root.querySelector('[data-warteschlange]');
      const vBox = root.querySelector('[data-verlauf]');
      const zeit = d => new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

      const titelVon = e => e.typ === 'meldung'
        ? (e.daten.art === 'material' ? `Materialanforderung: ${e.daten.positionen.length} Artikel` : (e.daten.gegenstand || e.daten.geraet_frei || 'Mängelmeldung'))
        : e.typ === 'checkliste_abschliessen' ? 'Checkliste abschließen' : 'Checkliste: Eintrag';

      abmelden = BK.warteschlange.beiAenderung(liste => {
        leeren(qBox);
        if (!liste.length) return;
        const ohneFehler = liste.filter(e => !e.fehler).length;
        qBox.append(el('div.list.vl-queue',
          ohneFehler ? el('div.row', el('div', { class: 'ico f-orange' }, icon('upload')),
            el('div.t', el('b', ohneFehler === 1 ? '1 Eintrag ist noch nicht gesendet' : `${ohneFehler} Einträge sind noch nicht gesendet`),
              el('span', navigator.onLine ? 'Wird gerade gesendet.' : 'Kein Netz. Die App sendet, sobald wieder Verbindung da ist.')),
            el('button.btn.sec', { type: 'button', onclick: () => BK.warteschlange.senden() }, 'Jetzt senden')) : null,
          ...liste.map(e => el('div.row',
            el('div', { class: 'ico ' + (e.fehler ? 'f-rot' : 'f-orange') }, icon(e.fehler ? 'alert' : 'upload')),
            el('div.t', el('b', titelVon(e)), el('span', e.fehler ? 'Abgelehnt: ' + e.fehler : zeit(e.erstellt) + (e.daten.gemeldet_von ? ' · ' + e.daten.gemeldet_von : ''))),
            e.fehler
              ? [el('button.btn.sec', { type: 'button', onclick: () => BK.warteschlange.erneut(e.nr) }, 'Erneut'),
                 el('button.btn.sec', { type: 'button', onclick: async () => { if (await confirmDialog('Eintrag verwerfen?', 'Er wird nicht gesendet und ist danach weg.')) BK.warteschlange.verwerfen(e.nr); } }, 'Verwerfen')]
              : el('span.pill.queue', 'Nicht gesendet')))));
      });

      try {
        const [eintraege, meldungen] = await Promise.all([api.verlauf({ fahrzeugId: fz.id, limit: 200 }), api.meldungen({ fahrzeugId: fz.id })]);
        const mNach = Object.fromEntries(meldungen.map(m => [m.id, m]));
        const titel = m => m.art === 'material' ? `Material: ${m.positionen.length} Artikel` : (m.geraet ? m.geraet.name : (m.gegenstand || m.geraet_frei));
        leeren(vBox);
        if (!eintraege.length) return vBox.append(el('div.leer', 'Noch nichts passiert.'));
        const heute = new Date().toDateString();
        let gruppe = null, liste = null;
        for (const v of eintraege) {
          const d = new Date(v.am);
          const g = d.toDateString() === heute ? 'Heute' : d.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
          if (g !== gruppe) { gruppe = g; liste = el('div.list'); vBox.append(el('div.sect', g), liste); }
          const m = v.meldung_id && mNach[v.meldung_id];
          const [was, ic] = (AKTION[v.aktion] || (() => [BK.aktionText(v.aktion), 'clock']))(v.details || {}, m);
          const datum = g === 'Heute' ? zeit(v.am) : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' · ' + zeit(v.am);
          liste.append(el('div.row',
            el('div', { class: 'ico ' + (FARBE[ic] || 'f-navy') }, icon(ic)),
            el('div.t', el('b', m ? `${titel(m)}` : was),
              el('span', [m ? was : null, datum, v.wer_name, v.details && v.details.grund].filter(Boolean).join(' · '))),
            m ? el('span', { class: 'pill ' + m.status }, { offen: 'Offen', in_bearbeitung: 'In Bearbeitung', erledigt: 'Erledigt' }[m.status]) : null));
        }
      } catch (e) {
        leeren(vBox).append(el('div.leer', 'Verlauf lässt sich nicht laden. ' + e.message));
      }
    },
    stop() { if (abmelden) abmelden(); abmelden = null; },
  });
})();
