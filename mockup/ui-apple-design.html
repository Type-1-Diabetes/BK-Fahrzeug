// Modul Fahrzeuge › Übersicht (Mac): erst alle KTW als Kacheln nach Wache, ein Klick öffnet die Akte mit Reitern
BK.modul('fahrzeuge', {
  async start(root, ctx) {
    const { el, api, leeren, mac } = BK;
    const liste = root.querySelector('[data-liste]');
    const akte = root.querySelector('[data-akte]');
    const zurueck = root.querySelector('[data-zurueck]');
    zurueck.prepend(BK.icon('chevL'));
    zurueck.onclick = () => { gewaehlt = null; zeichnen(); };
    const suche = root.querySelector('[data-suche]');
    const jetzt = new Date();
    let fristen = [];
    let ampelVorher = null, geaendert = new Set();
    let fahrzeuge = [], meldungen = [], checklisten = [], tablets = [], wache = '', gewaehlt = (ctx.extra && ctx.extra.fahrzeug) || null, reiter = 'meldungen';

    async function laden() {
      try {
        [fahrzeuge, meldungen, checklisten, fristen] = await Promise.all([api.fahrzeuge(), api.meldungen({ seitTagen: 365 }), api.checklisten(), api.fristen().catch(() => [])]);
        if (ampelVorher) geaendert = new Set(fahrzeuge.filter(f => ampelVorher[f.id] && ampelVorher[f.id] !== f.ampel).map(f => f.id));
        ampelVorher = Object.fromEntries(fahrzeuge.map(f => [f.id, f.ampel]));
        fahrzeuge.sort((a, b) => a.wache.name.localeCompare(b.wache.name, 'de') || a.name.localeCompare(b.name, 'de', { numeric: true }));
      } catch (e) { leeren(liste).append(el('div.mleer', 'Liste lässt sich nicht laden: ' + e.message)); return; }
      if (ctx.ich.rolle === 'admin') tablets = await api.tablets().catch(() => []);
      const wachen = [...new Map(fahrzeuge.map(f => [f.wache.id, f.wache.name])).entries()];
      const seg = root.querySelector('[data-wachen]');
      leeren(seg).append(...[['', 'Alle Wachen'], ...wachen].map(([id, name]) =>
        el('button', { type: 'button', class: wache === id ? 'on' : null, onclick: () => { wache = id; laden(); } }, name.replace(/^Wache /, ''))));
      const rot = fahrzeuge.filter(f => f.ampel !== 'einsatzbereit').length;
      root.querySelector('[data-sub]').textContent = `${fahrzeuge.length} KTW` + (rot ? ` · ${rot} nicht einsatzbereit` : '');
      zeichnen();
    }
    suche.oninput = () => zeichnen();

    const offeneVon = (f, art) => meldungen.filter(m => m.fahrzeug_id === f.id && m.art === art && m.status !== 'erledigt');
    const checkStand = f => {
      const fr = BK.fristen.fuer(fristen, f);
      const c = checklisten.find(x => x.fahrzeug_id === f.id && x.zeitraum === fr.key);
      if (c && c.gegengezeichnet_am) return ['erledigt', 'Checkliste erledigt'];
      if (c && c.abgeschlossen_am) return ['warte', 'wartet auf Gegenzeichnung'];
      if (c) return ['warte', 'Checkliste läuft'];
      return [fr.tage < 0 ? 'rot' : 'warte', 'fällig ' + fr.bis];
    };
    // Ohne Auswahl: Kacheln. Mit Auswahl: Akte des KTW.
    function zeichnen() {
      const q = suche.value.trim().toLowerCase();
      const l = fahrzeuge.filter(f => (!wache || f.wache.id === wache) && (!q || [f.name, f.kennzeichen, f.kennnummer].join(' ').toLowerCase().includes(q)));
      const auswahl = fahrzeuge.find(x => x.id === gewaehlt);
      root.classList.toggle('fz-akte', !!auswahl);
      zurueck.hidden = !auswahl;
      leeren(liste);
      if (auswahl) return datei();
      leeren(akte);
      let gruppe = null, raster = null;
      for (const f of l) {
        if (f.wache.name !== gruppe) {
          gruppe = f.wache.name;
          raster = el('div.fz-raster');
          liste.append(el('h2.fz-wache', gruppe), raster);
        }
        const mg = offeneVon(f, 'mangel').length, mt = offeneVon(f, 'material').length;
        const [ck, ckText] = checkStand(f);
        const rot = f.ampel !== 'einsatzbereit';
        raster.append(el('button', { type: 'button', class: 'fz-kachel' + (rot ? ' rot' : '') + (geaendert.has(f.id) ? ' aufleuchten' : ''), onclick: () => { gewaehlt = f.id; reiter = 'meldungen'; zeichnen(); } },
          el('div.fz-kopf', el('b', f.name), el('span', { class: 'amp klein ' + f.ampel }, rot ? 'Nicht einsatzbereit' : 'Einsatzbereit')),
          rot && f.ampel_grund ? el('div.fz-grund-k', f.ampel_grund) : el('div.fz-kz', f.kennzeichen || ''),
          el('dl.fz-zahlen',
            el('div', el('dt', 'Mängel'), el('dd', { class: mg ? 'red' : null }, String(mg))),
            el('div', el('dt', 'Material'), el('dd', String(mt))),
            el('div', el('dt', 'Checkliste'), el('dd', { class: ck === 'rot' ? 'red' : ck === 'warte' ? 'warnt' : 'gruen-t' }, ckText)))));
      }
      if (!l.length) liste.append(el('div.mleer', 'Kein KTW gefunden.'));
    }

    async function datei() {
      leeren(akte);
      const f = fahrzeuge.find(x => x.id === gewaehlt);
      if (!f) return;
      const tab = tablets.filter(t => t.fahrzeug_id === f.id && t.zuletzt_online).sort((a, b) => b.zuletzt_online.localeCompare(a.zuletzt_online))[0];
      const mg = offeneVon(f, 'mangel'), mt = offeneVon(f, 'material');
      const [ck, ckText] = checkStand(f);
      const inhalt = el('div');
      akte.append(
        el('div.hd', el('h2', f.name), el('span', { class: 'amp ' + f.ampel }, f.ampel === 'einsatzbereit' ? 'Einsatzbereit' : 'Nicht einsatzbereit')),
        el('div.sub2', [f.kennzeichen, f.kennnummer && 'Kennnummer ' + f.kennnummer, f.wache.name, tab && 'Tablet zuletzt online ' + mac.kurz(tab.zuletzt_online)].filter(Boolean).join(' · ')),
        f.ampel !== 'einsatzbereit' && f.ampel_grund ? el('div.fz-grund', f.ampel_grund + (f.ampel_am ? ' · seit ' + BK.datum(f.ampel_am) : '')) : '',
        el('div.fz-aktionen',
          el('button', { type: 'button', class: 'pbtn gross ' + (f.ampel === 'einsatzbereit' ? 'stopp' : 'los'), onclick: async () => {
            try { if (await mac.ampelAendern(f)) laden(); } catch (e) { alertDialog('Hat nicht geklappt', e.message); }
          } }, BK.icon(f.ampel === 'einsatzbereit' ? 'alert' : 'check'), f.ampel === 'einsatzbereit' ? 'Nicht einsatzbereit melden' : 'Wieder einsatzbereit'),
          el('span.fz-trenner'),
          el('button.pbtn.gross', { type: 'button', onclick: () => BK.blatt('mangel', f, laden) }, BK.icon('wrench'), 'Mängelmeldung erstellen'),
          el('button.pbtn.gross', { type: 'button', onclick: () => BK.blatt('material', f, laden) }, BK.icon('box'), 'Materialanforderung erstellen')),
        el('div.kpis',
          el('div.kpi', el('span', 'Offene Mängel'), el('b', { class: mg.length ? 'red' : null }, String(mg.length))),
          el('div.kpi', el('span', 'Offene Materialanforderungen'), el('b', String(mt.length))),
          el('div.kpi', el('span', 'Checkliste'), el('b', { class: ck === 'rot' ? 'red' : ck === 'warte' ? 'warnt' : null }, ckText)),
          el('div.kpi', el('span', 'Nächste STK/MTK'), el('b', { 'data-stk': '' }, '…'))),
        el('div.tabs', { role: 'tablist' }, [['meldungen', 'Meldungen'], ['checklisten', 'Checklisten'], ['geraete', 'Geräte'], ['verlauf', 'Verlauf']].map(([k, t]) =>
          el('button', { type: 'button', role: 'tab', 'aria-selected': String(reiter === k), class: reiter === k ? 'on' : null, onclick: () => { reiter = k; datei(); } }, t))),
        inhalt);

      let geraete = [];
      try { geraete = await api.geraete(f.id); } catch { /* egal */ }
      const naechste = geraete.filter(g => g.pruefung_bis).sort((a, b) => a.pruefung_bis.localeCompare(b.pruefung_bis))[0];
      const stk = akte.querySelector('[data-stk]');
      if (stk) stk.textContent = naechste ? `${naechste.name} · ${new Date(naechste.pruefung_bis).toLocaleDateString('de-DE', { month: '2-digit', year: 'numeric' })}` : '–';

      const tabelle = (kopf, zeilen, leer) => el('table.tab',
        el('thead', el('tr', kopf.map(k => el('th', k)))),
        el('tbody', zeilen.length ? zeilen : el('tr', el('td.mleer', { colspan: kopf.length }, leer))));

      if (reiter === 'meldungen') {
        const ms = meldungen.filter(m => m.fahrzeug_id === f.id).slice(0, 50);
        inhalt.append(tabelle(['Status', 'Meldung', 'Art', 'Gemeldet', 'Von'],
          ms.map(m => el('tr', { dataset: { klick: '' }, onclick: () => ctx.oeffnen(m.art === 'material' ? 'ausgabe' : 'maengel') },
            el('td', mac.pill(m.status)), el('td', mac.titel(m)), el('td', m.art === 'material' ? 'Materialanforderung' : 'Mängelmeldung'), el('td', mac.kurz(m.erstellt_am)), el('td', m.gemeldet_von))),
          'Noch keine Meldungen.'));
      } else if (reiter === 'checklisten') {
        const cs = checklisten.filter(c => c.fahrzeug_id === f.id);
        inhalt.append(tabelle(['Zeitraum', 'Begonnen', 'Abgeschlossen', 'Team', 'Abweichungen', 'Gegengezeichnet'],
          cs.map(c => el('tr', el('td', BK.fristen.zeitraumText(c.zeitraum)), el('td', BK.datum(c.begonnen_am)),
            el('td', c.abgeschlossen_am ? BK.datum(c.abgeschlossen_am) : '–'), el('td', [c.mitarbeiter1, c.mitarbeiter2].filter(Boolean).join(', ') || '–'),
            el('td', String(c.eintraege.length)), el('td', c.gegengezeichnet_am ? BK.datum(c.gegengezeichnet_am, false) : '–'))),
          'Noch keine Checkliste.'));
      } else if (reiter === 'geraete') {
        inhalt.append(tabelle(['Gerät', 'Seriennummer', 'Hersteller', 'Prüfung', 'Fällig'],
          geraete.map(g => el('tr', el('td', g.name), el('td', g.seriennummer || '–'), el('td', g.hersteller || '–'), el('td', (g.pruefart || '–').toUpperCase()),
            el('td', { class: g.pruefung_bis && new Date(g.pruefung_bis) < jetzt ? 'red' : null }, g.pruefung_bis ? BK.datum(g.pruefung_bis, false) : '–'))),
          'Keine Geräte eingetragen.'),
          el('div.foot', { style: 'padding:8px 0 0' }, 'Geräte pflegt später der Admin auf dem eigenen Webserver.'));
      } else {
        try {
          const v = await api.verlauf({ fahrzeugId: f.id, limit: 100 });
          inhalt.append(tabelle(['Wann', 'Was', 'Wer'], v.map(e => el('tr', el('td', BK.datum(e.am)),
            el('td', ({ gemeldet: 'Meldung', status: 'Status: ' + (mac.STATUS[e.details.nach] || ''), bearbeitet: 'Meldung bearbeitet',
              ampel: e.details.ampel === 'einsatzbereit' ? 'Einsatzbereit gesetzt' : 'Nicht einsatzbereit: ' + (e.details.grund || ''),
              ausgegeben: 'Material ausgegeben', teilweise_ausgegeben: 'Material zum Teil ausgegeben', checkliste_begonnen: 'Checkliste begonnen',
              checkliste_abgeschlossen: 'Checkliste abgeschlossen', gegengezeichnet: 'Checkliste gegengezeichnet', checkliste_zurueck: 'Checkliste zurück ans Team',
              tablet_gekoppelt: 'Tablet gekoppelt', tablet_entkoppelt: 'Tablet entkoppelt', tablet_angelegt: 'Tablet angelegt',
              tablet_neuer_code: 'Neuer Kopplungscode', tablet_bearbeitet: 'Tablet bearbeitet', tablet_gesperrt: 'Tablet gesperrt', tablet_entsperrt: 'Tablet entsperrt',
              meldung_geloescht: e.details.art === 'material' ? 'Materialanforderung gelöscht' : 'Mängelmeldung gelöscht', checkliste_geloescht: 'Checkliste gelöscht' })[e.aktion] || BK.aktionText(e.aktion)),
            el('td', e.wer_name || '–'))), 'Noch nichts passiert.'));
        } catch (e) { inhalt.append(el('div.mleer', e.message)); }
      }
    }

    BK.beiNeu(() => laden());
    laden();
  },
});

// Modul Mängel (Mac): Tabelle, rechts die Felder vom Papierformular in dessen Reihenfolge
(function () {
  // Felder der Bearbeitung als Beschreibung. Gespeichert in meldungen.bearbeitung (jsonb).
  const ABSCHNITTE = [
    { titel: 'Teamleitung / Geschäftsführung informiert', felder: [
      { key: 'info_tl_wie', typ: 'wahl', label: 'TL', optionen: [['telefonisch', 'Telefonisch'], 'E-Mail'] },
      { key: 'info_gf_wie', typ: 'wahl', label: 'GF', optionen: [['telefonisch', 'Telefonisch'], 'E-Mail', 'Fax'] },
    ] },
    { titel: 'Gesichtet', felder: [
      { key: 'gesichtet_name', typ: 'text', label: 'Name', max: 80 },
      { key: 'fotografiert', typ: 'check', label: 'Schaden', text: 'fotografiert' },
      { key: 'gesichtet_datum', typ: 'datum', label: 'Datum' },
      { key: 'gesichtet_bemerkung', typ: 'textarea', label: 'Bemerkung', max: 500 },
    ] },
    { titel: 'Reparatur', felder: [
      { key: 'reparatur', typ: 'wahl', label: 'Reparatur', senkrecht: true,
        optionen: [['intern', 'Erledigt intern'], ['extern', 'Reparatur extern'], ['instand', 'Instandgesetzt / wieder einsatzbereit'], ['unreparabel', 'Unreparabel']] },
      { key: 'intern_von', typ: 'text', label: 'Erledigt intern, von', max: 80, wenn: w => w.reparatur === 'intern' },
      { key: 'extern_durch', typ: 'text', label: 'Reparatur extern durch', max: 120, wenn: w => w.reparatur === 'extern' },
      { key: 'termin', typ: 'termin', label: 'Termin am', wenn: w => w.reparatur === 'extern' },
      { key: 'kv', typ: 'check', label: 'KV', text: 'angefordert', wenn: w => w.reparatur === 'extern' },
      { key: 'einsatzbereit_am', typ: 'datum', label: 'Wieder einsatzbereit am', hinweis: 'Mit Datum wird der Mangel beim Speichern erledigt.', wenn: w => w.reparatur === 'instand' },
      { key: 'reparatur_bemerkung', typ: 'textarea', label: 'Bemerkung', max: 500 },
    ] },
    { titel: 'Mängelbericht für richtig befunden', hinweis: 'Datum und Unterschrift nur durch Leitstelle, FDL oder BL.', felder: [
      { key: 'befunden_name', typ: 'text', label: 'Name', max: 80 },
      { key: 'befunden_datum', typ: 'datum', label: 'Datum' },
    ] },
  ];
  // Ältere Einträge (ein gemeinsames „Wie“, lose Reparaturfelder) auf die Papier-Felder umsetzen
  function altUebernehmen(w) {
    if (!w.info_tl_wie && w.info_teamleitung && ['telefonisch', 'E-Mail'].includes(w.info_wie)) w.info_tl_wie = w.info_wie;
    if (!w.info_gf_wie && w.info_gf && w.info_wie) w.info_gf_wie = w.info_wie;
    if (!w.reparatur) w.reparatur = w.unreparabel ? 'unreparabel' : w.einsatzbereit_am ? 'instand' : w.extern_durch ? 'extern' : w.intern_von ? 'intern' : null;
    if (w.termin && w.termin.length === 10) w.termin += 'T08:00';
    for (const k of ['info_teamleitung', 'info_gf', 'info_wie', 'unreparabel']) delete w[k];
    return w;
  }
  const AKTION = { gemeldet: 'Gemeldet', status: 'Status', bearbeitet: 'Bearbeitet', ampel: 'Fahrzeugstatus' };

  BK.modul('maengel', {
    async start(root, ctx) {
      const { el, icon, api, leeren, mac } = BK;
      const tbody = root.querySelector('[data-liste]');
      const insp = root.querySelector('[data-insp]');
      const ktw = root.querySelector('[data-ktw]');
      const suche = root.querySelector('[data-suche]');
      root.querySelector('[data-export]').append(icon('export'), 'Export');
      let status = 'offen', alle = [], fahrzeuge = [], gewaehlt = null, ungesichert = false, speichernAktuell = null;
      // Vor dem Wechseln oder Schließen: speichern, verwerfen oder bleiben
      const weiter = async () => {
        if (!ungesichert) return true;
        const a = await speichernDialog('Änderungen speichern?', 'Du hast in dieser Mängelmeldung etwas geändert.');
        if (a === 'verwerfen') { ungesichert = false; return true; }
        return a === 'speichern' && (await speichernAktuell()) !== false;
      };
      BK.vorVerlassen = weiter;
      window.addEventListener('beforeunload', e => { if (ungesichert && root.isConnected) e.preventDefault(); });

      root.querySelectorAll('[data-status] button').forEach(b => b.onclick = async () => {
        if (!await weiter()) return;
        status = b.dataset.v;
        root.querySelectorAll('[data-status] button').forEach(x => x.classList.toggle('on', x === b));
        gewaehlt = null; zeichnen();
      });
      ktw.onchange = () => { gewaehlt = null; zeichnen(); };
      suche.oninput = () => zeichnen();
      mac.tastatur(tbody, id => waehlen(id));

      const gefiltert = () => {
        const q = suche.value.trim().toLowerCase();
        return alle.filter(m => (status === 'alle' || m.status === status) && (!ktw.value || m.fahrzeug_id === ktw.value)
          && (!q || [mac.titel(m), m.beschreibung, m.gemeldet_von, m.fahrzeug.name].join(' ').toLowerCase().includes(q)));
      };
      const fzVon = m => fahrzeuge.find(f => f.id === m.fahrzeug_id) || { id: m.fahrzeug_id, name: m.fahrzeug.name, ampel: 'einsatzbereit' };

      async function laden(behalten) {
        try {
          [alle, fahrzeuge] = await Promise.all([api.meldungen({ art: 'mangel' }), api.fahrzeuge()]);
        } catch (e) {
          leeren(tbody).append(el('tr', el('td', { colspan: 6 }, 'Liste lässt sich nicht laden: ' + e.message)));
          return;
        }
        if (ktw.options.length === 1) {
          ktw.append(...fahrzeuge.map(f => el('option', { value: f.id }, f.name)));
          root.querySelector('[data-neu]').replaceWith(mac.neuFuer('mangel', 'Neue Mängelmeldung', fahrzeuge, () => laden(true)));
        }
        const offen = alle.filter(m => m.status === 'offen').length;
        root.querySelector('[data-sub]').textContent = offen === 1 ? '1 offen' : `${offen} offen`;
        if (!behalten) gewaehlt = null;
        zeichnen();
      }

      function zeichnen() {
        const liste = gefiltert();
        if (!liste.some(m => m.id === gewaehlt)) gewaehlt = liste[0] ? liste[0].id : null;
        leeren(tbody);
        if (!liste.length) tbody.append(el('tr', el('td.mleer', { colspan: 6 }, status === 'offen' ? 'Keine offenen Mängel.' : 'Nichts in dieser Liste.')));
        for (const m of liste) {
          const fz = fzVon(m);
          tbody.append(el('tr', { dataset: { id: m.id }, class: m.id === gewaehlt ? 'sel' : null, onclick: () => waehlen(m.id) },
            el('td', mac.pill(m.status)),
            el('td', mac.titel(m) + (fz.ampel === 'nicht_einsatzbereit' && m.status !== 'erledigt' ? ' · KTW nicht einsatzbereit' : '')),
            el('td', m.fahrzeug.name), el('td', m.betrifft === 'mpg' ? 'MPG' : 'KTW'),
            el('td', mac.kurz(m.erstellt_am)), el('td', m.gemeldet_von)));
        }
        inspektor();
      }

      async function waehlen(id) {
        if (id === gewaehlt || !await weiter()) return;
        gewaehlt = id;
        tbody.querySelectorAll('tr[data-id]').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === id));
        inspektor();
      }

      async function schliessen() {
        if (!await weiter()) return;
        gewaehlt = null;
        tbody.querySelectorAll('tr.sel').forEach(tr => tr.classList.remove('sel'));
        inspektor();
      }
      mac.escZu(root, insp, schliessen);

      function feld(f, werte) {
        const w = werte[f.key];
        const setz = v => { werte[f.key] = v; ungesichert = true; insp.querySelector('[data-ungesichert]').hidden = false; };
        switch (f.typ) {
          case 'wahl': {
            // Kreise wie auf dem Papier: genau eins ankreuzen, nochmal klicken nimmt es zurück
            const name = 'w_' + f.key;
            return el('div', { class: 'rbs' + (f.senkrecht ? ' senk' : ''), role: 'radiogroup', 'aria-label': f.label }, f.optionen.map(o => {
              const [wert, text] = Array.isArray(o) ? o : [o, o];
              const r = el('input', { type: 'radio', name, value: wert, checked: w === wert,
                onclick: e => { const neu = werte[f.key] === wert ? null : wert; e.target.checked = !!neu; setz(neu); sichtbar(werte); } });
              return el('label.rb', r, text);
            }));
          }
          case 'termin': return el('input.tf', { type: 'datetime-local', step: 300, value: w || '', 'aria-label': f.label, onchange: e => setz(e.target.value || null) });
          case 'check': return el('label.cb', el('input', { type: 'checkbox', checked: !!w, onchange: e => setz(e.target.checked) }), f.text);
          case 'datum': return el('input.tf', { type: 'date', value: w || '', 'aria-label': f.label, onchange: e => setz(e.target.value || null) });
          case 'textarea': return el('textarea.tf', { maxlength: f.max, 'aria-label': f.label, placeholder: 'optional', oninput: e => setz(e.target.value) }, w || '');
          case 'auswahl': return el('select.tf', { 'aria-label': f.label, onchange: e => setz(e.target.value || null) },
            el('option', { value: '' }, '–'), ...f.optionen.map(o => el('option', { value: o, selected: w === o }, o)));
          default: return el('input.tf', { maxlength: f.max, value: w || '', 'aria-label': f.label, oninput: e => setz(e.target.value) });
        }
      }

      // Felder mit „wenn“ nur zeigen, wenn die Auswahl passt (z. B. „extern durch“ nur bei Reparatur extern)
      function sichtbar(werte) {
        for (const a of ABSCHNITTE) for (const f of a.felder) if (f.wenn)
          insp.querySelectorAll(`[data-k="${f.key}"]`).forEach(n => { n.hidden = !f.wenn(werte); });
      }

      async function inspektor() {
        const m = alle.find(x => x.id === gewaehlt);
        ungesichert = false;
        leeren(insp);
        insp.classList.toggle('zu', !m);
        insp.classList.add('hat-druck');
        if (!m) return;
        const fz = fzVon(m);
        const werte = altUebernehmen({ ...(m.bearbeitung || {}) });
        speichernAktuell = () => sichern(m, werte, null);
        const fotos = el('div.fotos-m');
        const verlauf = el('div.tl');
        insp.append(mac.zuKnopf(schliessen),
          el('h2', mac.titel(m)),
          el('div.m', [m.fahrzeug.name, BK.datum(m.erstellt_am), m.gemeldet_von].join(' · ')),
          m.geraet ? el('div.m', 'Gerät: ' + [m.geraet.name, m.geraet.seriennummer && 'SN ' + m.geraet.seriennummer].filter(Boolean).join(' · ')) : '',
          m.geraet_frei && m.gegenstand == null ? el('div.m', 'Gerät: ' + m.geraet_frei) : '',
          el('div.note', m.beschreibung || 'Keine Beschreibung.'),
          fotos,
          ...ABSCHNITTE.map(a => el('section.grp.mgrp', el('h3', a.titel), a.hinweis ? el('p.grp-hinweis', a.hinweis) : null,
            el('div.kv', ...a.felder.flatMap(f => [
              el('span.l', { dataset: { k: f.key } }, f.label),
              el('div', { dataset: { k: f.key } }, feld(f, werte), f.hinweis ? el('div.feld-hinweis', f.hinweis) : null)])))),
          el('div.ih', 'Verlauf'), verlauf,
          druckMangel(m, werte),
          el('div.acts',
            el('span.ungesichert', { dataset: { ungesichert: '' }, hidden: true }, 'Nicht gespeichert'),
            el('button.pbtn', { type: 'button', title: 'Drucken oder als PDF speichern (⌘P / Strg+P)', onclick: () => window.print() }, 'Drucken'),
            mac.loeschKnopf('Mängelmeldung', () => api.meldungLoeschen(m.id), () => { ungesichert = false; gewaehlt = null; laden(true); }),
            el('button.pbtn', { type: 'button', onclick: async () => {
              try { if (await mac.ampelAendern(fz, mac.titel(m))) laden(true); } catch (e) { alertDialog('Hat nicht geklappt', e.message); }
            } }, fz.ampel === 'einsatzbereit' ? 'KTW nicht einsatzbereit …' : 'KTW einsatzbereit …'),
            el('button.pbtn', { type: 'button', title: 'Speichern (⌘S / Strg+S)', dataset: { sichern: '' }, onclick: e => mitStatus(e.currentTarget, () => sichern(m, werte, null)) }, 'Speichern'),
            m.status === 'erledigt'
              ? el('button.pbtn.def', { type: 'button', onclick: e => mitStatus(e.currentTarget, () => sichern(m, werte, 'in_bearbeitung')) }, 'Wieder öffnen')
              : el('button.pbtn.def', { type: 'button', dataset: { fertig: '' }, title: 'Als erledigt markieren (⌘↩ / Strg+↩)', onclick: e => mitStatus(e.currentTarget, () => sichern(m, werte, 'erledigt')) }, 'Als erledigt markieren')));

        sichtbar(werte);
        for (const f of m.fotos || []) api.fotoUrl(f.pfad)
          .then(u => fotos.append(el('a', { href: u, target: '_blank', rel: 'noopener', title: 'Foto groß öffnen' }, el('img', { src: u, alt: 'Foto zum Mangel' }))))
          .catch(() => {});
        try {
          const v = await api.verlauf({ meldungId: m.id });
          leeren(verlauf).append(...v.reverse().map(e => el('div',
            el('b', e.aktion === 'status' ? mac.STATUS[e.details.nach] || 'Status' : AKTION[e.aktion] || e.aktion),
            ' · ' + mac.kurz(e.am) + (e.wer_name ? ' · ' + e.wer_name : ''))));
        } catch { /* Verlauf ist nur Zusatz */ }
      }

      // Druck wie das Papierformular, mit dem gespeicherten Stand
      function druckMangel(m, w) {
        const d = new Date(m.erstellt_am);
        const r = w.reparatur;
        const termin = w.termin ? new Date(w.termin) : null;
        const tag = v => v ? BK.datum(v, false) : '';
        return BK.druckblatt({ bereich: 'Formulare', titel: 'Mängelmeldung', dok: 'BK_Formulare_Mängelmeldung', version: '2025-01-14' },
          el('div.dr-box',
            el('div.dr-reihe', BK.kreuz(false, 'PKW'), BK.kreuz(m.betrifft !== 'mpg', 'KTW'), BK.kreuz(false, 'RTW'), BK.kreuz(false, 'Gebäude'),
              BK.kreuz(m.betrifft === 'mpg', 'MPG:'), BK.linie('SN', m.geraet ? m.geraet.seriennummer : m.geraet_frei)),
            el('div.dr-zeile',
              el('div', el('span', 'Amtl. Kennzeichen / Ort / Gegenstand:'), el('b', [m.fahrzeug.kennzeichen, mac.titel(m)].filter(Boolean).join(' · '))),
              el('div', el('span', 'Funkruf:'), el('b', m.fahrzeug.name)),
              el('div', el('span', 'Datum:'), el('b', d.toLocaleDateString('de-DE'))),
              el('div', el('span', 'Zeit:'), el('b', d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })))),
            el('div.dr-text', m.beschreibung || ''),
            el('div.dr-reihe', BK.linie('Gemeldet durch:', m.gemeldet_von), BK.linie('Unterschrift:', 'digital, ' + BK.datum(m.erstellt_am)))),
          el('div.dr-box',
            el('div', el('h4', 'Teamleitung / Geschäftführung informiert'),
              el('div.dr-reihe', el('b', 'TL'), BK.kreuz(w.info_tl_wie === 'telefonisch', 'Telefonisch'), BK.kreuz(w.info_tl_wie === 'E-Mail', 'E-Mail'),
                el('b', 'GF'), BK.kreuz(w.info_gf_wie === 'telefonisch', 'Telefonisch'), BK.kreuz(w.info_gf_wie === 'E-Mail', 'E-Mail'), BK.kreuz(w.info_gf_wie === 'Fax', 'Fax'))),
            el('div', el('h4', 'Gesichtet'),
              el('div.dr-reihe', BK.linie('Name:', w.gesichtet_name), BK.kreuz(!!w.fotografiert, 'Schaden Fotografiert'), BK.linie('Datum:', tag(w.gesichtet_datum))),
              el('div', 'Bemerkung:'), el('div.dr-text.klein', w.gesichtet_bemerkung || '')),
            el('div', el('h4', 'Reparatur'),
              el('div.dr-felder',
                el('div.dr-reihe', BK.kreuz(r === 'intern', 'Erledigt intern, von'), BK.linie('', w.intern_von)),
                el('div.dr-reihe', BK.kreuz(r === 'extern', 'Reparatur extern durch:'), BK.linie('', w.extern_durch)),
                el('div.dr-reihe', BK.kreuz(!!termin, 'Termin am:'), BK.linie('', termin ? termin.toLocaleDateString('de-DE') : ''),
                  BK.linie('um', termin ? termin.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr' : ''), BK.linie('KV:', w.kv ? 'angefordert' : '')),
                el('div.dr-reihe', BK.kreuz(r === 'instand', 'Instandgesetzt / wieder einsatzbereit am:'), BK.linie('', tag(w.einsatzbereit_am)), BK.kreuz(r === 'unreparabel', 'unreparabel'))),
              el('div', 'Bemerkung:'), el('div.dr-text.klein', w.reparatur_bemerkung || ''))),
          el('div.dr-unter', BK.linie('Mängelbericht für richtig befunden (Datum & Unterschrift nur durch Leitstelle, FDL oder BL)',
            [w.befunden_name, tag(w.befunden_datum)].filter(Boolean).join(', '))));
      }

      async function sichern(m, werte, neuerStatus) {
        let s = neuerStatus || m.status;
        if (!neuerStatus && werte.reparatur === 'instand' && werte.einsatzbereit_am) s = 'erledigt';
        else if (!neuerStatus && s === 'offen' && Object.values(werte).some(Boolean)) s = 'in_bearbeitung';
        if (s === 'erledigt' && m.status !== 'erledigt' && !await confirmDialog('Als erledigt markieren?', 'Das Team sieht die Mängelmeldung dann 7 Tage als erledigt.')) return false;
        for (const k of Object.keys(werte)) if (typeof werte[k] === 'string') werte[k] = werte[k].trim().slice(0, 500) || null;
        try {
          await api.meldungBearbeiten(m.id, s, werte);
          ungesichert = false;
          showToast(s === 'erledigt' && m.status !== 'erledigt' ? 'Mangel erledigt' : s !== m.status && s === 'in_bearbeitung' && m.status === 'erledigt' ? 'Mangel wieder offen' : 'Gespeichert');
          const fz = fzVon(m);
          if (s === 'erledigt' && fz.ampel === 'nicht_einsatzbereit' && await confirmDialog(`${fz.name} ist noch nicht einsatzbereit`, 'Soll der KTW wieder fahren dürfen?')) {
            await api.ampelSetzen(fz.id, 'einsatzbereit', null);
            showToast(`${fz.name} ist wieder einsatzbereit`);
          }
          await laden(true);
        } catch (e) { alertDialog('Nicht gespeichert', e.message); return false; }
      }

      root.querySelector('[data-export]').onclick = () => {
        const zeilen = gefiltert().map(m => ({
          Status: mac.STATUS[m.status], Mangel: mac.titel(m), KTW: m.fahrzeug.name, Art: m.betrifft === 'mpg' ? 'MPG' : 'KTW',
          Beschreibung: m.beschreibung, Gemeldet: BK.datum(m.erstellt_am), Von: m.gemeldet_von, Erledigt: m.erledigt_am ? BK.datum(m.erledigt_am) : '',
          ...m.bearbeitung }));
        if (!exportCSV('maengel-' + new Date().toISOString().slice(0, 10) + '.csv', zeilen)) alertDialog('Nichts zu exportieren', 'Die Liste ist leer.');
      };

      // ⌘S / Strg+S speichert die offene Mängelmeldung
      root.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); insp.querySelector('[data-sichern]')?.click(); }
      });
      BK.beiNeu(() => { if (!ungesichert) laden(true); });
      laden();
    },
  });
})();

// Modul Materialanforderungen (Mac). Ausgegebene Menge ist vorbelegt, bei weniger Ware anpassen. „Ausgegeben durch“ und Datum setzt die App.
BK.modul('ausgabe', {
  async start(root) {
    const { el, icon, api, leeren, mac } = BK;
    const liste = root.querySelector('[data-liste]');
    const akte = root.querySelector('[data-akte]');
    root.querySelector('[data-export]').append(icon('export'), 'Export');
    let status = 'offen', alle = [], gewaehlt = null, geaendert = false;
    const weiter = async () => !geaendert || await confirmDialog('Änderungen verwerfen?', 'Du hast erhaltene Mengen geändert und noch nicht ausgegeben.');
    BK.vorVerlassen = weiter;

    root.querySelectorAll('[data-status] button').forEach(b => b.onclick = async () => {
      if (!await weiter()) return;
      geaendert = false;
      status = b.dataset.v;
      root.querySelectorAll('[data-status] button').forEach(x => x.classList.toggle('on', x === b));
      gewaehlt = null; zeichnen();
    });
    const gefiltert = () => alle.filter(m => status === 'alle' || m.status === status);

    const neu = root.querySelector('[data-neu]');
    api.fahrzeuge().then(f => neu.replaceWith(mac.neuFuer('material', 'Neue Materialanforderung', f, () => laden()))).catch(() => {});

    async function laden() {
      try { alle = await api.meldungen({ art: 'material' }); }
      catch (e) { leeren(liste).append(el('div.mleer', 'Liste lässt sich nicht laden: ' + e.message)); return; }
      const n = alle.filter(m => m.status !== 'erledigt').length;
      root.querySelector('[data-sub]').textContent = n === 1 ? '1 offene Anforderung' : `${n} offene Anforderungen`;
      zeichnen();
    }

    function zeichnen() {
      const l = gefiltert();
      if (!l.some(m => m.id === gewaehlt)) gewaehlt = l[0] ? l[0].id : null;
      leeren(liste).append(el('div.vgrp', { alle: 'Alle', offen: 'Offen', in_bearbeitung: 'In Bearbeitung', erledigt: 'Ausgegeben' }[status]));
      if (!l.length) liste.append(el('div.mleer', status === 'erledigt' ? 'Noch nichts ausgegeben.' : status === 'offen' ? 'Keine offenen Anforderungen.' : 'Nichts in dieser Liste.'));
      for (const m of l) liste.append(el('button', { type: 'button', class: 'vr' + (m.id === gewaehlt ? ' on' : ''), onclick: async () => { if (m.id === gewaehlt || !await weiter()) return; geaendert = false; gewaehlt = m.id; zeichnen(); } },
        el('i', { class: m.status === 'erledigt' ? 'gruen' : m.status === 'offen' ? 'blau' : 'orange' }),
        el('div', el('b', `${m.fahrzeug.name} · ${m.positionen.length} Artikel`), el('span', `${mac.kurz(m.erstellt_am)} · ${m.gemeldet_von}`))));
      datei();
    }

    function datei() {
      leeren(akte);
      akte.classList.add('hat-druck');
      const m = alle.find(x => x.id === gewaehlt);
      if (!m) return akte.append(el('div.mleer', 'Anforderung links auswählen.'));
      const fertig = m.status === 'erledigt';
      const erhalten = {};
      const b = m.bearbeitung || {};
      akte.append(
        el('div.hd', el('h2', 'Materialanforderung ' + m.fahrzeug.name), mac.pill(m.status)),
        el('div.sub2', `Material angefordert am ${mac.kurz(m.erstellt_am)} für ${m.fahrzeug.name} · angefordert durch ${m.gemeldet_von}`),
        // Spalten wie auf dem Papier: Artikel, Größe, angeforderte und erhaltene Menge, Verbr./Abgel. angekreuzt
        el('table.tab.aus-tab',
          el('thead', el('tr', el('th', 'Artikel'), el('th', 'Größe'), el('th.num', 'Angeforderte Menge'), el('th.num', 'Erhaltene Menge'), el('th.kreuz', 'Verbraucht'), el('th.kreuz', 'Abgelaufen'))),
          el('tbody', m.positionen.map(p => {
            erhalten[p.id] = p.erhalten ?? p.menge;
            return el('tr', el('td', p.artikel), el('td', p.groesse || '–'), el('td.num', String(p.menge)),
              el('td.num', fertig ? String(p.erhalten ?? 0) : el('input.tf.sm', { type: 'number', min: 0, max: 999, inputmode: 'numeric', value: p.erhalten ?? p.menge,
                'aria-label': 'Erhaltene Menge: ' + p.artikel, oninput: e => { geaendert = true; erhalten[p.id] = e.target.value === '' ? null : Math.max(0, Math.min(999, Number(e.target.value))); } })),
              el('td.kreuz', p.grund === 'verbraucht' ? '×' : ''), el('td.kreuz', p.grund === 'abgelaufen' ? '×' : ''));
          }))),
        el('div.aus-sig',
          el('div', el('span', 'Ausgegeben durch'), el('b', b.ausgegeben_von || '–')),
          el('div', el('span', 'Ausgegeben am'), el('b', b.ausgegeben_am ? BK.datum(b.ausgegeben_am, false) : '–'))),
        fertig ? '' : el('div.foot.aus-hinweis', 'Fehlt etwas im Lager? „Erhaltene Menge“ anpassen.'),
        BK.druckblatt({ bereich: 'Formulare', titel: 'Material-Anforderung', dok: 'Material-Anforderung', version: '2015-04-23' },
          el('h4.dr-h', 'Materialanforderung'),
          el('table.dr-tab',
            el('thead', el('tr', el('th', 'Artikel'), el('th', 'Größe'), el('th.num', 'Angeforderte Menge'), el('th.num', 'Erhaltene Menge'), el('th.kreuz', 'Verbraucht'), el('th.kreuz', 'Abgelaufen'))),
            el('tbody', m.positionen.map(p => el('tr', el('td', p.artikel), el('td', p.groesse || ''), el('td.num', String(p.menge)),
              el('td.num', p.erhalten != null ? String(p.erhalten) : ''), el('td.kreuz', p.grund === 'verbraucht' ? 'X' : ''), el('td.kreuz', p.grund === 'abgelaufen' ? 'X' : ''))))),
          el('div.dr-unter',
            BK.linie('Material angefordert am:', BK.datum(m.erstellt_am)),
            BK.linie('Material angefordert für Fahrzeug/ Raum:', m.fahrzeug.name),
            BK.linie('Angefordert durch Mitarbeiter:', m.gemeldet_von + ' (digital)'),
            BK.linie('Ausgegeben durch Mitarbeiter:', b.ausgegeben_von),
            BK.linie('Ausgegeben am:', b.ausgegeben_am ? BK.datum(b.ausgegeben_am, false) : ''))),
        el('div.acts',
          el('button.pbtn', { type: 'button', title: 'Drucken oder als PDF speichern (⌘P / Strg+P)', onclick: () => window.print() }, 'Drucken'),
          mac.loeschKnopf('Materialanforderung', () => api.meldungLoeschen(m.id), () => { gewaehlt = null; laden(); }),
          fertig ? '' : el('button.pbtn.def.gross', { type: 'button', dataset: { fertig: '' }, title: 'Als ausgegeben markieren (⌘↩ / Strg+↩)', onclick: e => mitStatus(e.currentTarget, () => ausgeben(m, erhalten, true)) }, BK.icon('check'), 'Als ausgegeben markieren')));
    }

    async function ausgeben(m, erhalten, erledigt) {
      const positionen = m.positionen.map(p => ({ id: p.id, erhalten: erhalten[p.id] ?? (erledigt ? p.menge : null) }));
      try { await api.materialAusgeben(m.id, positionen, erledigt); geaendert = false; showToast(`Material für ${m.fahrzeug.name} ausgegeben`); await laden(); }
      catch (e) { alertDialog('Nicht gespeichert', e.message); return false; }
    }

    root.querySelector('[data-export]').onclick = () => {
      const zeilen = gefiltert().flatMap(m => m.positionen.map(p => ({
        KTW: m.fahrzeug.name, Angefordert: BK.datum(m.erstellt_am), Von: m.gemeldet_von, Artikel: p.artikel, Größe: p.groesse,
        'Angeforderte Menge': p.menge, 'Erhaltene Menge': p.erhalten, 'Verbraucht': p.grund === 'verbraucht' ? 'x' : '', 'Abgelaufen': p.grund === 'abgelaufen' ? 'x' : '', Status: mac.STATUS[m.status],
        'Ausgegeben durch': (m.bearbeitung || {}).ausgegeben_von || '' })));
      if (!exportCSV('material-' + new Date().toISOString().slice(0, 10) + '.csv', zeilen)) alertDialog('Nichts zu exportieren', 'Die Liste ist leer.');
    };

    BK.beiNeu(() => { if (!geaendert) laden(); });
    laden();
  },
});

// Modul Gegenzeichnen (Mac): Team schließt ab, MPGler zeichnet gegen. Abweichungen stehen oben.
BK.modul('gegenzeichnen', {
  async start(root) {
    const { el, icon, api, leeren, mac } = BK;
    const liste = root.querySelector('[data-liste]');
    const akte = root.querySelector('[data-akte]');
    root.querySelector('[data-csv]').append(icon('export'), 'Tabelle');
    root.querySelector('[data-pdf]').append(icon('export'), 'PDF');
    const vorlagen = {};  // vorlage_id → Bereiche
    let listen = [];  // Vorlagen mit „Liste Feuerwehr“
    api.vorlagen().then(v => { listen = v; }).catch(() => {});
    let alle = [], gewaehlt = null, ganz = false;
    const quartal = BK.fristen.zeitraumText;

    async function vorlage(id) {
      if (!vorlagen[id]) vorlagen[id] = await api.vorlage(id, { alle: true });
      return vorlagen[id];
    }

    async function laden() {
      try { alle = await api.checklisten(); }
      catch (e) { leeren(liste).append(el('div.mleer', 'Liste lässt sich nicht laden: ' + e.message)); return; }
      const n = alle.filter(c => c.abgeschlossen_am && !c.gegengezeichnet_am).length;
      root.querySelector('[data-sub]').textContent = n === 0 ? 'Nichts wartet auf dich' : n === 1 ? '1 wartet auf dich' : `${n} warten auf dich`;
      zeichnen();
    }

    function zeichnen() {
      const gruppen = [
        ['Wartet auf Gegenzeichnung', alle.filter(c => c.abgeschlossen_am && !c.gegengezeichnet_am), 'orange'],
        ['Beim Team', alle.filter(c => !c.abgeschlossen_am), 'blau'],
        ['Gegengezeichnet', alle.filter(c => c.gegengezeichnet_am).slice(0, 30), 'gruen'],
      ];
      if (!alle.some(c => c.id === gewaehlt)) gewaehlt = (gruppen.find(g => g[1].length) || [null, []])[1][0]?.id || null;
      leeren(liste);
      for (const [titel, l, farbe] of gruppen) {
        if (!l.length) continue;
        liste.append(el('div.vgrp', titel));
        for (const c of l) liste.append(el('button', { type: 'button', class: 'vr' + (c.id === gewaehlt ? ' on' : ''), onclick: () => { gewaehlt = c.id; zeichnen(); } },
          el('i', { class: farbe }),
          el('div', el('b', `${c.fahrzeug.name} · ${quartal(c.zeitraum)}`),
            el('span', c.abgeschlossen_am
              ? `${mac.kurz(c.abgeschlossen_am)} · ${c.eintraege.length ? c.eintraege.length + ' Abweichungen' : 'keine Abweichung'}`
              : 'begonnen ' + mac.kurz(c.begonnen_am) + (c.zurueck_grund ? ' · zurückgegeben' : '')))));
      }
      if (!alle.length) liste.append(el('div.mleer', 'Noch keine Checkliste.'));
      datei();
    }

    async function datei() {
      leeren(akte);
      akte.classList.add('hat-druck');
      const c = alle.find(x => x.id === gewaehlt);
      if (!c) return akte.append(el('div.mleer', 'Checkliste links auswählen.'));
      let bereiche = [];
      try { bereiche = await vorlage(c.vorlage_id); } catch { /* Abweichungen ohne Namen */ }
      if (c.id !== gewaehlt) return;
      const pos = new Map(bereiche.flatMap(b => b.positionen.map(p => [p.id, { ...p, bereich: b }])));
      const gesamt = pos.size;
      const befund = (p, e) => [e.ist != null ? `Ist ${e.ist} / Soll ${p ? p.soll : '?'}` : null, e.verfall ? 'Verfall ' + BK.datum(e.verfall, false) : null].filter(Boolean).join(' · ') || 'Hinweis';
      const dauer = c.abgeschlossen_am ? `${BK.datum(c.begonnen_am)} bis ${new Date(c.abgeschlossen_am).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}` : 'seit ' + BK.datum(c.begonnen_am);
      const warten = c.abgeschlossen_am && !c.gegengezeichnet_am;

      akte.append(
        el('div.hd', el('h2', `${c.fahrzeug.name} · Überprüfung Vollzähligkeit`)),
        el('div.sub2', `${quartal(c.zeitraum)} · Vorlage KTW Standard · § 20 Abs. 2 HmbRDG`),
        el('div.sig',
          el('div', el('span', 'Geprüft'), el('b', dauer)),
          el('div', el('span', 'Mitarbeiter 1'), el('b', c.mitarbeiter1 || '–')),
          el('div', el('span', 'Mitarbeiter 2'), el('b', c.mitarbeiter2 || '–'))),
        c.gegengezeichnet_am ? el('div.sub2', 'Gegengezeichnet am ' + BK.datum(c.gegengezeichnet_am)) : '',
        c.zurueck_grund && !c.abgeschlossen_am ? el('div.sub2.red', 'Zurück ans Team: ' + c.zurueck_grund) : '',
        el('div.tabs', { role: 'tablist', 'aria-label': 'Ansicht' }, [['kurz', 'Übersicht'], ['ganz', `Ganze Liste (${gesamt || '?'})`]].map(([k, t]) =>
          el('button', { type: 'button', role: 'tab', class: (k === 'ganz') === ganz ? 'on' : null, 'aria-selected': String((k === 'ganz') === ganz), onclick: () => { ganz = k === 'ganz'; datei(); } }, t))),
        el('div.gz-kurz' + (ganz ? '.gz-aus' : ''), uebersicht(c, pos, gesamt, befund)),
        // Ganze Liste wie die Papierliste: am Bildschirm über den Reiter, im Druck immer
        el('div.gz-voll' + (ganz ? '.zeigen' : ''), BK.papierliste(bereiche, c.eintraege)),
        BK.druckblatt({ bereich: 'MPG', titel: 'Liste Überprüfung KTW, medizinisches Material', dok: 'MPG.doc', version: '14.04.2025' },
          el('p', 'Überprüfung der Fahrzeuge Blauer Kreis GmbH angelehnt an die Liste der Feuerwehr Hamburg auf Vollzähligkeit Med. Produkte und zusätzlichen Material. Grundlage der Liste ist § 20 Abs. 2 HmbRDG Überprüfung von Krankenkraftwagen.'),
          el('div.dr-felder',
            BK.linie('Datum der Überprüfung:', BK.datum(c.begonnen_am, false)),
            BK.linie('Datum Abgabe:', c.abgeschlossen_am ? BK.datum(c.abgeschlossen_am, false) : ''),
            el('div.dr-reihe', BK.linie('Zuständige Mitarbeiter:', c.mitarbeiter1), BK.linie('', c.mitarbeiter2)),
            el('div.dr-reihe', BK.linie('Liste Feuerwehr:', (listen.find(v => v.id === c.vorlage_id) || {}).liste_feuerwehr),
              BK.linie('KTW:', c.fahrzeug.name), BK.linie('Amtliches Kennzeichen:', c.fahrzeug.kennzeichen))),
          BK.papierliste(bereiche, c.eintraege),
          el('div.dr-unter',
            BK.linie('Unterschrift Mitarbeiter 1:', c.mitarbeiter1 ? c.mitarbeiter1 + ' (digital)' : ''),
            BK.linie('Unterschrift Mitarbeiter 2:', c.mitarbeiter2 ? c.mitarbeiter2 + ' (digital)' : ''),
            BK.linie('Gegengezeichnet MPG-Beauftragter:', c.gegengezeichnet_am ? 'digital' : ''),
            BK.linie('Datum:', c.gegengezeichnet_am ? BK.datum(c.gegengezeichnet_am, false) : '')),
          el('div.dr-legende', el('span', 'Legende:'), el('span'),
            ...[['blau', 'Sauerstoff'], ['orange', 'Hygiene'], ['rot', 'Wundversorgung'], ['gruen', 'Diagnostik'], ['gelb', 'Immobilisation']]
              .flatMap(([f, t]) => [el('i', { class: f }), el('span', t)]))),
        el('div.acts', mac.loeschKnopf('Checkliste', () => api.checklisteLoeschen(c.id), () => { gewaehlt = null; laden(); }),
        ...(warten ? [
          el('button.pbtn', { type: 'button', onclick: async () => {
            const grund = await promptDialog('Zurück ans Team?', 'Das Team sieht den Grund auf dem Tablet und kann die Checkliste ändern.', { placeholder: 'z. B. Bereich Sauerstoff bitte nochmal prüfen', confirmLabel: 'Zurückgeben' });
            if (grund == null) return;
            try { await api.checklisteZurueck(c.id, grund.trim().slice(0, 300)); showToast('Checkliste ist zurück beim Team'); laden(); } catch (e) { alertDialog('Hat nicht geklappt', e.message); }
          } }, 'Zurück ans Team'),
          el('button.pbtn.def', { type: 'button', dataset: { fertig: '' }, title: 'Gegenzeichnen (⌘↩ / Strg+↩)', onclick: async () => {
            if (!await confirmDialog('Gegenzeichnen?', `${c.fahrzeug.name}, ${quartal(c.zeitraum)}. Dein Name und die Uhrzeit werden gespeichert.`)) return;
            try { await api.checklisteGegenzeichnen(c.id); showToast(`${c.fahrzeug.name} gegengezeichnet`); laden(); } catch (e) { alertDialog('Hat nicht geklappt', e.message); }
          } }, 'Gegenzeichnen')] : [])));
    }

    // Kurz: Zahlen oben, darunter nur, was nicht stimmt, nach Bereich
    function uebersicht(c, pos, gesamt, befund) {
      const e = c.eintraege;
      const fehlt = e.filter(x => { const p = pos.get(x.position_id); return x.ist != null && p && x.ist < p.soll; }).length;
      const verfall = e.filter(x => x.verfall).length;
      const kasten = el('div.gz-befunde');
      const nachBereich = new Map();
      for (const x of e) {
        const p = pos.get(x.position_id);
        const k = p ? p.bereich.id : '?';
        if (!nachBereich.has(k)) nachBereich.set(k, { b: p && p.bereich, l: [] });
        nachBereich.get(k).l.push([p, x]);
      }
      for (const { b, l } of nachBereich.values()) {
        kasten.append(el('div', { class: 'gz-bereich ' + ((b && b.farbe) || '') }, b ? b.name : 'Unbekannter Bereich'),
          ...l.map(([p, x]) => el('div.gz-befund',
            el('span.gz-nr', p ? BK.lfd(p).nr : ''),
            el('div', el('b', p ? p.artikel : 'Position'), x.bemerkung ? el('span', x.bemerkung) : null),
            el('span.warnt', befund(p, x)))));
      }
      return [
        el('div.kpis',
          el('div.kpi', el('span', 'Geprüft'), el('b', `${gesamt} Positionen`)),
          el('div.kpi', el('span', 'Vollständig'), el('b.gruen-t', String(gesamt - e.length))),
          el('div.kpi', el('span', 'Fehlt'), el('b', { class: fehlt ? 'warnt' : null }, String(fehlt))),
          el('div.kpi', el('span', 'Verfall / Prüffrist'), el('b', { class: verfall ? 'warnt' : null }, String(verfall)))),
        e.length ? kasten : el('div.gz-alles', icon('check'), 'Alles vollständig. Nichts fehlt, nichts läuft ab.'),
      ];
    }

    root.querySelector('[data-pdf]').onclick = () => { if (gewaehlt) window.print(); };
    root.querySelector('[data-csv]').onclick = async () => {
      const c = alle.find(x => x.id === gewaehlt);
      if (!c) return;
      const bereiche = await vorlage(c.vorlage_id).catch(() => []);
      const zeilen = bereiche.flatMap(b => b.positionen.map(p => {
        const e = c.eintraege.find(x => x.position_id === p.id) || {};
        return { KTW: c.fahrzeug.name, Zeitraum: quartal(c.zeitraum), Bereich: b.name, Nr: p.nr, Artikel: p.artikel, Soll: p.soll,
          Ist: e.ist ?? p.soll, Verfall: e.verfall || '', Bemerkung: e.bemerkung || '', 'Mitarbeiter 1': c.mitarbeiter1 || '', 'Mitarbeiter 2': c.mitarbeiter2 || '',
          Begonnen: BK.datum(c.begonnen_am), Abgeschlossen: c.abgeschlossen_am ? BK.datum(c.abgeschlossen_am) : '', Gegengezeichnet: c.gegengezeichnet_am ? BK.datum(c.gegengezeichnet_am) : '' };
      }));
      if (!exportCSV(`checkliste-${c.fahrzeug.name.replace(/\W+/g, '-')}-${c.zeitraum}.csv`, zeilen)) alertDialog('Nichts zu exportieren', 'Die Vorlage lässt sich nicht laden.');
    };

    BK.beiNeu(() => laden());
    laden();
  },
});

// Modul Vorlage bearbeiten (Admin): Bereiche und Positionen der Checkliste anlegen, ändern, verschieben, löschen.
// Positionen, die schon in einer Checkliste stehen, blendet die Datenbank beim Löschen nur aus.
(function () {
  const FARBEN = [['', 'Ohne Farbe'], ['blau', 'Blau (Sauerstoff)'], ['orange', 'Orange (Hygiene)'], ['rot', 'Rot (Wundversorgung)'], ['gruen', 'Grün (Diagnostik)'], ['gelb', 'Gelb (Immobilisation)']];
  const PRUEF = { keine: 'Keine', verfall: 'Verfallsdatum', stk: 'STK', mtk: 'MTK' };

  BK.modul('vorlage', {
    async start(root) {
      const { el, icon, api, leeren, mac } = BK;
      const liste = root.querySelector('[data-bereiche]');
      const kopf = root.querySelector('[data-kopf]');
      const tbody = root.querySelector('[data-positionen]');
      const insp = root.querySelector('[data-insp]');
      let vorlage = null, bereiche = [], bereichId = null, positionId = null, ungesichert = false;
      const weiter = async () => !ungesichert || await confirmDialog('Änderungen verwerfen?', 'Die Position ist noch nicht gespeichert.');
      BK.vorVerlassen = weiter;
      const bereich = () => bereiche.find(b => b.id === bereichId);

      async function laden() {
        try {
          if (!vorlage) vorlage = (await api.vorlagen())[0];
          if (!vorlage) return leeren(liste).append(el('div.mleer', 'Keine Vorlage vorhanden.'));
          bereiche = await api.vorlage(vorlage.id);
        } catch (e) { leeren(liste).append(el('div.mleer', 'Lässt sich nicht laden: ' + e.message)); return; }
        const n = bereiche.reduce((s, b) => s + b.positionen.length, 0);
        root.querySelector('[data-sub]').textContent = `${vorlage.name} · ${bereiche.length} Bereiche · ${n} Positionen`;
        if (!bereiche.some(b => b.id === bereichId)) bereichId = bereiche[0] ? bereiche[0].id : null;
        zeichnen();
      }

      function zeichnen() {
        leeren(liste);
        for (const b of bereiche) {
          liste.append(el('button', { type: 'button', class: 'vr' + (b.id === bereichId ? ' on' : ''), onclick: async () => {
            if (b.id === bereichId || !await weiter()) return;
            bereichId = b.id; positionId = null; ungesichert = false; zeichnen();
          } }, el('span', { class: 'stripe ' + (b.farbe || '') }), el('div', el('b', b.name), el('span', b.positionen.length === 1 ? '1 Position' : `${b.positionen.length} Positionen`))));
        }
        if (!bereiche.length) liste.append(el('div.mleer', 'Noch kein Bereich.'));
        tabelle();
      }

      // Kopf und Tabelle des gewählten Bereichs
      function tabelle() {
        const b = bereich();
        leeren(kopf); leeren(tbody);
        if (!b) { kopf.append(el('h2', 'Bereich links wählen')); return inspektor(); }
        const i = bereiche.indexOf(b);
        kopf.append(
          el('h2', el('span', { class: 'stripe ' + (b.farbe || '') }), b.name),
          el('span.vo-pfeile',
            el('button.tb', { type: 'button', title: 'Bereich nach oben', disabled: i === 0, onclick: () => schieben('bereich', b.id, -1) }, icon('chevL')),
            el('button.tb', { type: 'button', title: 'Bereich nach unten', disabled: i === bereiche.length - 1, onclick: () => schieben('bereich', b.id, 1) }, icon('chevR'))),
          el('button.pbtn', { type: 'button', onclick: () => bereichDialog(b) }, 'Umbenennen'),
          el('button.pbtn.rot', { type: 'button', onclick: () => bereichLoeschen(b) }, 'Löschen'));
        b.positionen.forEach((p, j) => tbody.append(el('tr', { dataset: { id: p.id }, class: p.id === positionId ? 'sel' : null, onclick: () => waehlen(p.id) },
          el('td.num', String(j + 1)), el('td', p.artikel + (p.optional ? ' (falls vorhanden)' : '')), el('td.vo-hinweis', p.hinweis || '–'),
          el('td.num', String(p.soll)), el('td', PRUEF[p.pruefart] || p.pruefart),
          el('td.num', el('span.vo-pfeile',
            el('button.tb', { type: 'button', title: 'Nach oben', disabled: j === 0, onclick: e => { e.stopPropagation(); schieben('position', p.id, -1); } }, BK.icon('chevL')),
            el('button.tb', { type: 'button', title: 'Nach unten', disabled: j === b.positionen.length - 1, onclick: e => { e.stopPropagation(); schieben('position', p.id, 1); } }, BK.icon('chevR')))))));
        if (!b.positionen.length) tbody.append(el('tr', el('td.mleer', { colspan: 6 }, 'Noch keine Position. Oben rechts „Neue Position“.')));
        inspektor();
      }

      async function waehlen(id) {
        if (id === positionId || !await weiter()) return;
        positionId = id; ungesichert = false;
        tbody.querySelectorAll('tr[data-id]').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === id));
        inspektor();
      }
      mac.tastatur(tbody, id => waehlen(id));
      async function schliessen() {
        if (!await weiter()) return;
        positionId = null; ungesichert = false;
        tbody.querySelectorAll('tr.sel').forEach(tr => tr.classList.remove('sel'));
        inspektor();
      }
      mac.escZu(root, insp, schliessen);

      // Formular rechts: Position bearbeiten oder neu anlegen (positionId = 'neu')
      function inspektor() {
        leeren(insp);
        const b = bereich();
        const p = positionId === 'neu' ? { artikel: '', hinweis: '', soll: 1, pruefart: 'keine', optional: false } : b && b.positionen.find(x => x.id === positionId);
        insp.classList.toggle('zu', !p);
        if (!p) return;
        ungesichert = false;
        const merk = () => { ungesichert = true; hinweis.hidden = false; };
        const artikel = el('input.tf', { maxlength: 120, value: p.artikel, oninput: merk, 'aria-label': 'Artikel' });
        const text = el('input.tf', { maxlength: 200, value: p.hinweis || '', placeholder: 'z. B. Hersteller, SN XXXX', oninput: merk, 'aria-label': 'Hinweis' });
        const soll = el('input.tf.sm', { type: 'number', min: 0, max: 999, value: p.soll, oninput: merk, 'aria-label': 'Soll' });
        const pruef = el('select.tf', { onchange: merk, 'aria-label': 'Prüfung' }, ...Object.entries(PRUEF).map(([k, t]) => el('option', { value: k, selected: p.pruefart === k }, t)));
        const optional = el('input', { type: 'checkbox', checked: p.optional, onchange: merk });
        const hinweis = el('span.ungesichert', { hidden: true }, 'Nicht gespeichert');
        const sichern = el('button.pbtn.def', { type: 'button', title: 'Speichern (⌘S / Strg+S)', dataset: { sichern: '' }, onclick: e => mitStatus(e.currentTarget, async () => {
          const daten = { artikel: artikel.value.trim(), hinweis: text.value.trim() || null, soll: Number(soll.value), pruefart: pruef.value, optional: optional.checked };
          if (!daten.artikel) { alertDialog('Artikel fehlt', 'Bitte eintragen, was geprüft wird.'); return false; }
          if (!Number.isInteger(daten.soll) || daten.soll < 0 || daten.soll > 999) { alertDialog('Soll prüfen', 'Bitte eine Zahl von 0 bis 999.'); return false; }
          try {
            const id = await api.positionSpeichern(positionId === 'neu' ? null : positionId, b.id, daten);
            showToast(positionId === 'neu' ? `${daten.artikel} hinzugefügt` : 'Gespeichert');
            ungesichert = false; positionId = id;
            await laden();
          } catch (err) { alertDialog('Nicht gespeichert', err.message); return false; }
        }) }, positionId === 'neu' ? 'Hinzufügen' : 'Speichern');
        insp.append(mac.zuKnopf(schliessen), el('div.vo-form',
          el('h2', positionId === 'neu' ? 'Neue Position' : p.artikel),
          el('div.m', b.name),
          el('div.kv',
            el('span.l', 'Artikel'), el('div', artikel),
            el('span.l', 'Hinweis'), el('div', text),
            el('span.l', 'Soll'), el('div', soll),
            el('span.l', 'Prüfung'), el('div', pruef),
            el('span.l', 'Nur wenn vorhanden'), el('div', el('label.cb', optional, 'ja'))),
          el('div.acts', hinweis,
            positionId !== 'neu' ? el('button.pbtn.rot', { type: 'button', onclick: () => positionLoeschen(p) }, 'Löschen') : null,
            sichern)));
        if (positionId === 'neu') artikel.focus();
      }

      async function schieben(art, id, richtung) {
        try { await api.verschieben(art, id, richtung); await laden(); }
        catch (e) { alertDialog('Hat nicht geklappt', e.message); }
      }

      async function bereichDialog(b) {
        const name = await promptDialog(b ? 'Bereich umbenennen' : 'Neuer Bereich', 'So heißt der Bereich auf dem Tablet.', { value: b ? b.name : '', placeholder: 'z. B. Notfallrucksack: Beatmung', confirmLabel: b ? 'Weiter' : 'Weiter' });
        if (name == null || !name.trim()) return;
        const farbe = await farbeWaehlen(b ? b.farbe || '' : '');
        if (farbe == null) return;
        try {
          const id = await api.bereichSpeichern(b ? b.id : null, vorlage.id, name.trim().slice(0, 80), farbe);
          showToast(b ? 'Bereich gespeichert' : `Bereich „${name.trim()}“ angelegt`);
          bereichId = id; positionId = null;
          await laden();
        } catch (e) { alertDialog('Nicht gespeichert', e.message); }
      }

      // Farbe über die eigene Auswahlliste in einem kleinen Fenster
      function farbeWaehlen(aktuell) {
        return new Promise(fertig => {
          const sel = el('select.tf', { 'aria-label': 'Farbe' }, ...FARBEN.map(([k, t]) => el('option', { value: k, selected: k === aktuell }, t)));
          const zu = wert => { overlay.remove(); fertig(wert); };
          const overlay = el('div.code-overlay', el('div.code-box', { role: 'dialog', 'aria-modal': 'true' },
            el('h2', 'Farbe des Bereichs'), el('p', 'Die Farbe erscheint als Streifen, wie auf der Papierliste.'), sel,
            el('div.code-acts', el('button.pbtn', { type: 'button', onclick: () => zu(null) }, 'Abbrechen'), el('button.pbtn.def', { type: 'button', onclick: () => zu(sel.value) }, 'Speichern'))));
          overlay.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.querySelector('.auswahl-liste')) zu(null); });
          document.body.append(overlay);
        });
      }

      async function bereichLoeschen(b) {
        if (!await confirmDialog(`„${b.name}“ löschen?`, `Der Bereich und seine ${b.positionen.length} Positionen verschwinden aus neuen Checklisten. Alte Checklisten bleiben lesbar.`)) return;
        try { await api.bereichLoeschen(b.id); showToast(`Bereich „${b.name}“ gelöscht`); bereichId = null; positionId = null; await laden(); }
        catch (e) { alertDialog('Hat nicht geklappt', e.message); }
      }

      async function positionLoeschen(p) {
        if (!await confirmDialog(`„${p.artikel}“ löschen?`, 'Die Position verschwindet aus neuen Checklisten. Alte Checklisten bleiben lesbar.')) return;
        try { await api.positionLoeschen(p.id); showToast(`${p.artikel} gelöscht`); ungesichert = false; positionId = null; await laden(); }
        catch (e) { alertDialog('Hat nicht geklappt', e.message); }
      }

      root.querySelector('[data-neuer-bereich]').onclick = async () => { if (await weiter()) bereichDialog(null); };
      root.querySelector('[data-neue-position]').onclick = async () => {
        if (!bereich()) return alertDialog('Erst einen Bereich wählen', 'Links den Bereich wählen, in den die Position soll.');
        if (!await weiter()) return;
        positionId = 'neu'; tabelle();
      };
      root.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); insp.querySelector('[data-sichern]')?.click(); }
      });
      BK.beiNeu(() => { if (!ungesichert) laden(); });
      laden();
    },
  });
})();

// Modul Fristen (Admin): Intervall und Erinnerung für die Checkliste, Standard und je Wache
BK.modul('fristen', {
  async start(root) {
    const { el, api, leeren } = BK;
    const { INTERVALLE, zeitraum, zeitraumText } = BK.fristen;
    const boxStandard = root.querySelector('[data-standard]');
    const boxWachen = root.querySelector('[data-wachen]');

    const vorschau = (intervall, vorlauf) => {
      const z = zeitraum(intervall);
      const erinnern = new Date(z.ende - vorlauf * 864e5);
      const d = x => x.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      return `Jetzt: ${zeitraumText(z.key)}, fällig bis ${d(z.ende)}, Erinnerung ab ${d(erinnern)}`;
    };

    // Eine Zeile: Name, Intervall, Tage vorher, Knopf. eigen = false heißt „wie Standard“ (nur bei Wachen).
    function zeile(titel, frist, wache, standard) {
      const auswahl = el('select.tf.auto', { 'aria-label': 'Intervall ' + titel },
        wache ? el('option', { value: '' }, 'Standard') : null,
        ...Object.entries(INTERVALLE).map(([k, t]) => el('option', { value: k, selected: frist && frist.intervall === k }, t)));
      if (wache && !frist) auswahl.value = '';
      const tage = el('input.tf', { type: 'number', min: 0, max: 90, value: frist ? frist.vorlauf_tage : standard.vorlauf_tage, 'aria-label': 'Tage vorher' });
      const info = el('span.fr-info');
      const knopf = el('button.pbtn', { type: 'button' }, 'Speichern');
      const zeigen = () => {
        const eigen = !wache || auswahl.value;
        tage.disabled = !eigen;
        info.textContent = eigen ? vorschau(auswahl.value || 'quartal', Number(tage.value) || 0) : 'Nutzt den Standard: ' + INTERVALLE[standard.intervall];
      };
      auswahl.addEventListener('change', zeigen);
      tage.addEventListener('input', zeigen);
      knopf.onclick = e => mitStatus(e.currentTarget, async () => {
        const n = Number(tage.value);
        if (!Number.isInteger(n) || n < 0 || n > 90) { alertDialog('Tage prüfen', 'Erinnerung: 0 bis 90 Tage vorher.'); return false; }
        try {
          if (wache && !auswahl.value) await api.fristEntfernen(wache.id);
          else await api.fristSetzen(wache ? wache.id : null, auswahl.value, n);
          showToast(`Frist für ${titel} gespeichert`);
          laden();
        } catch (err) { alertDialog('Nicht gespeichert', err.message); return false; }
      });
      zeigen();
      return el('div.fr-zeile', el('b', titel, info), auswahl, el('label.fr-tage', tage, 'Tage vorher'), knopf);
    }

    async function laden() {
      let fristen, wachen;
      try { [fristen, wachen] = await Promise.all([api.fristen(), api.wachen()]); }
      catch (e) { leeren(boxStandard).append(el('p.foot', 'Lässt sich nicht laden: ' + e.message)); return; }
      const standard = fristen.find(f => !f.wache_id && !f.fahrzeug_id) || { intervall: 'quartal', vorlauf_tage: 14 };
      leeren(boxStandard).append(zeile('Alle Wachen', standard, null, standard));
      leeren(boxWachen).append(...wachen.map(w => zeile(w.name, fristen.find(f => f.wache_id === w.id && !f.fahrzeug_id), w, standard)));
    }

    laden();
  },
});

// Modul Tablets (Admin): anlegen, Code anzeigen, neu koppeln, sperren
let warten = null;  // Prüfen, ob das neue Tablet gekoppelt ist
BK.modul('tablets', {
  async start(root) {
    const { el, api, leeren } = BK;
    const tbody = root.querySelector('[data-liste]');
    const overlay = root.querySelector('[data-code]');
    let fahrzeuge = [];

    const link = new URL('./?koppeln', location.href).href;

    // Code zeigen und prüfen, bis das Tablet gekoppelt ist
    function codeZeigen(titel, code, tabletId) {
      root.querySelector('[data-titel]').textContent = titel;
      root.querySelector('[data-wert]').textContent = code.slice(0, 4) + ' ' + code.slice(4);
      root.querySelector('[data-link]').textContent = link;
      root.querySelector('[data-kopieren]').onclick = () => copyText(code);
      root.querySelector('[data-link-kopieren]').onclick = () => copyText(link);
      const stand = root.querySelector('[data-stand]');
      stand.textContent = 'Wartet auf das Tablet …';
      stand.classList.remove('ok');
      overlay.hidden = false;
      root.querySelector('[data-fertig]').focus();
      clearInterval(warten);
      if (!tabletId) return;
      warten = setInterval(async () => {
        try {
          const t = (await api.tablets()).find(x => x.id === tabletId);
          if (!t || !t.gekoppelt_am) return;
          clearInterval(warten);
          stand.textContent = 'Tablet ist gekoppelt.';
          stand.classList.add('ok');
          if (typeof showToast === 'function') showToast(t.name + ' ist gekoppelt');
          laden();
        } catch { /* nächster Versuch */ }
      }, 3000);
    }
    const schliessen = () => { clearInterval(warten); overlay.hidden = true; laden(); };
    root.querySelector('[data-fertig]').onclick = schliessen;
    overlay.addEventListener('keydown', e => { if (e.key === 'Escape') schliessen(); });

    function status(t) {
      if (t.gesperrt) return ['offen', 'Gesperrt'];
      if (t.gekoppelt_am) return ['erledigt', 'Aktiv'];
      if (t.code_gueltig_bis && new Date(t.code_gueltig_bis) > new Date()) return ['in_bearbeitung', 'Wartet auf Kopplung'];
      return ['warte', t.code_gueltig_bis ? 'Code abgelaufen' : 'Nicht gekoppelt'];
    }

    async function laden() {
      try {
        fahrzeuge = await api.fahrzeuge();
        const tablets = await api.tablets();
        const fzName = id => (fahrzeuge.find(f => f.id === id) || {}).name || '–';
        leeren(tbody);
        if (!tablets.length) tbody.append(el('tr', el('td', { colspan: 5 }, 'Noch keine Tablets angelegt.')));
        for (const t of tablets) {
          const [klasse, text] = status(t);
          tbody.append(el('tr',
            el('td', t.name), el('td', fzName(t.fahrzeug_id)),
            el('td', el('span', { class: 'pill mp ' + klasse }, text)),
            el('td', t.zuletzt_online ? timeAgo(t.zuletzt_online) : '–'),
            el('td',
              el('button.pbtn', { type: 'button', onclick: () => blattOeffnen(t) }, 'Bearbeiten'),
              t.gekoppelt_am && !t.gesperrt ? el('button.pbtn', { type: 'button', onclick: async () => {
                const pin = await promptDialog(`${t.name} entkoppeln?`, 'Das Gerät zeigt danach wieder die Anmeldung. Der KTW bleibt, mit „Neuer Code“ koppelst du ein Gerät neu. Bitte Entkoppel-PIN eingeben.', { typ: 'password', inputmode: 'numeric', placeholder: 'PIN', confirmLabel: 'Entkoppeln' });
                if (pin == null) return;
                try {
                  const fehler = await api.tabletEntkoppelnAdmin(t.id, pin.trim());
                  if (fehler) return alertDialog('Nicht entkoppelt', fehler);
                  showToast(`${t.name} entkoppelt`); laden();
                } catch (e) { alertDialog('Hat nicht geklappt', e.message); }
              } }, 'Entkoppeln') : null,
              el('button.pbtn', { type: 'button', onclick: async () => {
                if (t.gekoppelt_am && !await confirmDialog('Neuen Code erzeugen?', `„${t.name}“ wird vom aktuellen Gerät getrennt und muss neu gekoppelt werden.`)) return;
                try { codeZeigen('Neuer Code für ' + t.name, await api.tabletNeuerCode(t.id), t.id); } catch (e) { alertDialog('Hat nicht geklappt', e.message); }
              } }, 'Neuer Code'),
              el('button.pbtn.rot', { type: 'button', onclick: async () => {
                const sperren = !t.gesperrt;
                if (sperren && !await confirmDialog('Tablet sperren?', `„${t.name}“ kann danach nichts mehr sehen oder melden.`)) return;
                try { await api.tabletSperren(t.id, sperren); showToast(`${t.name} ${sperren ? 'gesperrt' : 'entsperrt'}`); laden(); } catch (e) { alertDialog('Hat nicht geklappt', e.message); }
              } }, t.gesperrt ? 'Entsperren' : 'Sperren'))));
        }
      } catch (e) {
        leeren(tbody).append(el('tr', el('td', { colspan: 5 }, 'Liste lässt sich nicht laden: ' + e.message)));
      }
    }

    // Entkoppel-PIN festlegen (gilt für alle Tablets)
    const pinKnopf = root.querySelector('[data-pin]');
    const pinZeigen = async () => { try { pinKnopf.textContent = await api.entkoppelPinGesetzt() ? 'PIN ändern' : 'PIN festlegen'; } catch { /* Standardtext */ } };
    pinKnopf.onclick = async () => {
      const pin = await promptDialog('Entkoppel-PIN', 'Mit dieser PIN lässt sich ein Tablet entkoppeln, am Tablet und hier. 4 bis 8 Ziffern.', { typ: 'password', inputmode: 'numeric', placeholder: 'Neue PIN', confirmLabel: 'Weiter' });
      if (pin == null) return;
      if (!/^[0-9]{4,8}$/.test(pin.trim())) return alertDialog('PIN ungültig', 'Bitte 4 bis 8 Ziffern eingeben.');
      const nochmal = await promptDialog('PIN wiederholen', 'Zur Sicherheit noch einmal eingeben.', { typ: 'password', inputmode: 'numeric', placeholder: 'PIN', confirmLabel: 'Speichern' });
      if (nochmal == null) return;
      if (nochmal.trim() !== pin.trim()) return alertDialog('PINs sind verschieden', 'Bitte noch einmal festlegen.');
      try { await api.entkoppelPinSetzen(pin.trim()); showToast('Entkoppel-PIN gespeichert'); pinZeigen(); }
      catch (e) { alertDialog('Nicht gespeichert', e.message); }
    };
    pinZeigen();

    // Neues oder vorhandenes Tablet: Wache, KTW-Name und Tabletname
    const neuBlatt = root.querySelector('[data-neu-blatt]');
    const neuWache = root.querySelector('[data-neu-wache]');
    const neuKtw = root.querySelector('[data-neu-ktw]');
    const neuName = root.querySelector('[data-neu-name]');
    const neuKz = root.querySelector('[data-neu-kz]');
    const neuWeiter = root.querySelector('[data-neu-weiter]');
    const neuDa = root.querySelector('[data-neu-da]');
    const ausblenden = root.querySelector('[data-neu-ausblenden]');
    let nameGeaendert = false, bearbeiten = null, modus = 'neu';  // bearbeiten = Tablet beim Ändern; modus: neu | da (vorhandener KTW)
    const neuZu = () => { neuBlatt.hidden = true; };
    const pruefen = () => { neuWeiter.disabled = !neuName.value.trim() || (modus === 'da' ? !neuDa.value : !neuWache.value || !neuKtw.value.trim()); };
    const modusSetzen = m => {
      modus = m;
      for (const b of root.querySelectorAll('[data-neu-modus] button')) { b.classList.toggle('on', b.dataset.v === m); b.setAttribute('aria-checked', String(b.dataset.v === m)); }
      root.querySelector('[data-neu-felder]').hidden = m === 'da';
      root.querySelector('[data-da-felder]').hidden = m !== 'da';
      if (!nameGeaendert) neuName.value = m === 'da' ? (neuDa.selectedOptions[0] ? 'iPad ' + neuDa.selectedOptions[0].textContent : '') : (neuKtw.value.trim() ? 'iPad ' + neuKtw.value.trim() : '');
      pruefen();
    };
    for (const b of root.querySelectorAll('[data-neu-modus] button')) b.onclick = () => modusSetzen(b.dataset.v);
    neuDa.onchange = () => modusSetzen('da');
    root.querySelector('[data-neu-abbrechen]').onclick = neuZu;
    neuBlatt.addEventListener('keydown', e => { if (e.key === 'Escape') neuZu(); if (e.key === 'Enter' && !neuWeiter.disabled) neuWeiter.click(); });
    neuBlatt.addEventListener('mousedown', e => { if (e.target === neuBlatt) neuZu(); });
    neuWache.onchange = pruefen;
    neuKtw.oninput = () => { if (!nameGeaendert) neuName.value = neuKtw.value.trim() ? 'iPad ' + neuKtw.value.trim() : ''; pruefen(); };
    neuName.oninput = () => { nameGeaendert = true; pruefen(); };

    async function blattOeffnen(t) {
      let wachen = [];
      try { wachen = await api.wachen(); } catch (e) { return alertDialog('Hat nicht geklappt', e.message); }
      if (!wachen.length) return alertDialog('Keine Wachen', 'Lege zuerst unter Einstellungen eine Wache an.');
      bearbeiten = t || null;
      const fz = t ? fahrzeuge.find(f => f.id === t.fahrzeug_id) : null;
      // KTW ohne Tablet für „Vorhandener KTW“
      let tablets = [];
      if (!t) { try { tablets = await api.tablets(); } catch { /* Liste bleibt leer */ } }
      const ohne = t ? [] : fahrzeuge.filter(f => !tablets.some(x => x.fahrzeug_id === f.id));
      leeren(neuDa);
      for (const f of ohne) neuDa.append(el('option', { value: f.id }, f.name));
      root.querySelector('[data-neu-modus]').hidden = !!t || !ohne.length;
      ausblenden.hidden = !t;
      leeren(neuWache);
      for (const w of wachen) neuWache.append(el('option', { value: w.id }, w.name));
      if (fz && fz.wache) neuWache.value = fz.wache.id;
      root.querySelector('[data-neu-titel]').textContent = t ? 'Tablet bearbeiten' : 'Neues Tablet';
      root.querySelector('[data-neu-text]').textContent = t ? 'Änderungen gelten auch für den KTW.' : 'Jedes Tablet gehört fest zu einem KTW.';
      neuWeiter.textContent = t ? 'Speichern' : 'Code erzeugen';
      nameGeaendert = !!t;
      neuKtw.value = fz ? fz.name : '';
      neuKz.value = fz ? fz.kennzeichen || '' : '';
      neuName.value = t ? t.name : '';
      modusSetzen('neu');
      neuBlatt.hidden = false;
      neuKtw.focus();
    }
    root.querySelector('[data-neu]').onclick = () => blattOeffnen(null);

    neuWeiter.onclick = async () => {
      const ktw = neuKtw.value.trim(), name = neuName.value.trim();
      if (neuWeiter.disabled) return;
      neuWeiter.disabled = true;
      try {
        if (bearbeiten) {
          await api.tabletBearbeiten(bearbeiten.id, name, ktw, neuWache.value, neuKz.value.trim());
          neuZu(); showToast(name + ' gespeichert'); laden();
          return;
        }
        if (modus === 'da') {
          const f = fahrzeuge.find(x => x.id === neuDa.value);
          const code = await api.tabletAnlegen(f.id, name);
          const neu = (await api.tablets()).find(x => x.fahrzeug_id === f.id && !x.gekoppelt_am);
          neuZu();
          return codeZeigen('Neues Tablet für ' + f.name, code, neu && neu.id);
        }
        const code = await api.tabletMitFahrzeugAnlegen(neuWache.value, ktw, name, neuKz.value.trim());
        const neu = (await api.tablets()).find(t => t.name === name && !t.gekoppelt_am);
        neuZu();
        codeZeigen('Neues Tablet für ' + ktw, code, neu && neu.id);
      } catch (e) { pruefen(); alertDialog('Hat nicht geklappt', e.message); }
    };

    // KTW bewusst ausblenden: Tablet wird entfernt, Meldungen und Checklisten bleiben
    ausblenden.onclick = async () => {
      const fz = bearbeiten && fahrzeuge.find(f => f.id === bearbeiten.fahrzeug_id);
      if (!fz || !await confirmDialog(`${fz.name} ausblenden?`, 'Der KTW verschwindet aus der Übersicht, sein Tablet wird entfernt. Meldungen und Checklisten bleiben gespeichert. Mit gleichem Namen lässt er sich wieder anlegen.')) return;
      try { await api.fahrzeugAusblenden(fz.id); neuZu(); showToast(fz.name + ' ausgeblendet'); laden(); }
      catch (e) { alertDialog('Hat nicht geklappt', e.message); }
    };

    BK.beiNeu(() => { if (overlay.hidden) laden(); });
    laden();
  },
  stop() { clearInterval(warten); },
});
