# Edge Functions zu Supabase hochladen: auf GitHub unter Actions › „Edge Functions“ › „Run workflow“.
# Braucht das Repo-Secret SUPABASE_ACCESS_TOKEN (Supabase › Account › Access Tokens). Läuft nur von Hand, nie bei Pushes.
name: Edge Functions

on:
  workflow_dispatch:
    inputs:
      funktionen:
        description: "Welche Funktionen (mit Leerzeichen getrennt)"
        required: false
        default: "push-senden aufraeumen"

permissions:
  contents: read

concurrency:
  group: edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FUNKTIONEN: ${{ inputs.funktionen }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Hochladen (JWT-Prüfung aus, die Funktionen prüfen PUSH_GEHEIMNIS selbst)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN fehlt"; exit 1; fi
          for f in $FUNKTIONEN; do
            # Nur bekannte Funktionen, keine freien Eingaben
            case "$f" in push-senden|aufraeumen) ;; *) echo "Unbekannte Funktion: $f"; exit 1 ;; esac
            supabase functions deploy "$f" --no-verify-jwt --project-ref lotwccocevnlyymjjxia
          done
