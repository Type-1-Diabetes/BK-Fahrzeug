# Release: veröffentlicht die Web-App (Ordner web/) auf GitHub Pages, wenn ein Tag v* gepusht wird.
# Bewusst schlank: kein Build, keine Tests, kein Linting – damit Bugfix-Releases schnell gehen.
# Normale Commits/Pushes lösen nichts aus.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version für den Release (z. B. v0.1.0). Leer = nur Pages aktualisieren, kein Release."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Neuer Start bricht einen noch laufenden Lauf ab – spart Wartezeit bei schnellen Bugfixes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
          retention-days: 1   # nur Übergabe an Pages; die Seite selbst bleibt online
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: pages
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: ubuntu-24.04
    env: { VERSION: "${{ inputs.version || github.ref_name }}" }
    steps:
      - uses: actions/checkout@v5
      - name: Archiv packen
        run: cd web && zip -qr "../BK-Fahrzeug-${VERSION}.zip" .
      - uses: softprops/action-gh-release@v3
        with:
          files: BK-Fahrzeug-*.zip
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
